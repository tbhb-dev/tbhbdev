---
# Import contracts for Go packages in this repository.
# Add the front and lib components when they contain Go packages.
# For stdlib-only-front, keep vendor access disabled and allow imports
# from lib only. The lib component may depend on lib.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  agent-capacity-cmd: {in: factory/agent-capacity/cmd/*}
  agent-capacity-capacity: {in: factory/agent-capacity/internal/capacity}
  agent-capacity-keepalive: {in: factory/agent-capacity/internal/keepalive}
  agent-capacity-spool: {in: factory/agent-capacity/internal/spool}
  agent-capacity-session: {in: factory/agent-capacity/internal/session}
  agent-capacity-claude: {in: factory/agent-capacity/internal/source/claude}
  agent-capacity-agy: {in: factory/agent-capacity/internal/source/agy}
  agent-capacity-export: {in: factory/agent-capacity/internal/export}
  agent-capacity-codex: {in: factory/agent-capacity/internal/source/codex}

vendors:
  otel: {in: [go.opentelemetry.io/otel, go.opentelemetry.io/otel/**]}
  testify: {in: github.com/stretchr/testify/**}
  pty: {in: github.com/creack/pty}
  sys: {in: golang.org/x/sys/**}

deps:
  agent-capacity-cmd:
    mayDependOn: [agent-capacity-cmd, agent-capacity-capacity, agent-capacity-export, agent-capacity-codex, agent-capacity-spool, agent-capacity-claude, agent-capacity-agy, agent-capacity-session]
    canUse: [otel, testify]
  agent-capacity-capacity:
    mayDependOn: [agent-capacity-capacity]
    canUse: [testify]
  agent-capacity-keepalive:
    mayDependOn: [agent-capacity-keepalive]
    canUse: [testify]
  agent-capacity-export:
    mayDependOn: [agent-capacity-capacity, agent-capacity-export]
    canUse: [otel, testify]
  agent-capacity-codex:
    mayDependOn: [agent-capacity-capacity, agent-capacity-codex, agent-capacity-spool]
    canUse: [testify]
  agent-capacity-session:
    mayDependOn: [agent-capacity-session, agent-capacity-spool]
    canUse: [pty, sys]
  agent-capacity-spool:
    mayDependOn: [agent-capacity-spool, agent-capacity-capacity]
    canUse: [testify]
  agent-capacity-claude:
    mayDependOn: [agent-capacity-claude, agent-capacity-spool, agent-capacity-capacity]
    canUse: [testify]
  agent-capacity-agy:
    mayDependOn: [agent-capacity-agy, agent-capacity-spool, agent-capacity-capacity]
    canUse: [testify]
