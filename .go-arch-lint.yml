---
# Import contracts for Go packages in this repository.
# Stub for the Go CLI port (stdlib-only-front): enable `front` and `lib`
# when their directories exist. Keep `front` free of `canUse` vendor
# entries so `depOnAnyVendor: false` keeps the front layer stdlib-only.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  # front: {in: "**/front/**"}
  # lib: {in: lib/**}
  agent-capacity-cmd: {in: factory/agent-capacity/cmd/agent-capacity}
  agent-capacity-capacity: {in: factory/agent-capacity/internal/capacity}
  agent-capacity-keepalive: {in: factory/agent-capacity/internal/keepalive}
  agent-capacity-spool: {in: factory/agent-capacity/internal/spool}
  agent-capacity-session: {in: factory/agent-capacity/internal/session}
  agent-capacity-claude: {in: factory/agent-capacity/internal/source/claude}
  agent-capacity-agy: {in: factory/agent-capacity/internal/source/agy}
  agent-capacity-export: {in: factory/agent-capacity/internal/export}
  agent-capacity-codex: {in: factory/agent-capacity/internal/source/codex}
  metrics-cmd: {in: factory/github-metrics/cmd/github-metrics}
  metrics-appauth: {in: factory/github-metrics/internal/appauth}
  metrics-backfill: {in: factory/github-metrics/internal/backfill}
  metrics-budget: {in: factory/github-metrics/internal/budget}
  metrics-ghclient: {in: factory/github-metrics/internal/ghclient}
  metrics-receiver: {in: factory/github-metrics/internal/receiver}
  metrics-reconcile: {in: factory/github-metrics/internal/reconcile}
  metrics-recorder: {in: factory/github-metrics/internal/recorder}
  metrics-store: {in: factory/github-metrics/internal/store}
  metrics-telemetry: {in: factory/github-metrics/internal/telemetry}
  metrics-version: {in: factory/github-metrics/internal/version}
  metrics-worker: {in: factory/github-metrics/internal/worker}

vendors:
  bbolt: {in: [go.etcd.io/bbolt, go.etcd.io/bbolt/errors]}
  otel: {in: go.opentelemetry.io/otel/**}
  otel-root: {in: go.opentelemetry.io/otel}
  testify: {in: github.com/stretchr/testify/**}
  pty: {in: github.com/creack/pty}
  sys: {in: golang.org/x/sys/**}
  otlp: {in: go.opentelemetry.io/proto/otlp/**}
  protobuf: {in: google.golang.org/protobuf/proto}

deps:
  # front:
  #   mayDependOn: [lib]
  # lib:
  #   mayDependOn: [lib]
  agent-capacity-cmd:
    mayDependOn:
      - agent-capacity-agy
      - agent-capacity-capacity
      - agent-capacity-claude
      - agent-capacity-cmd
      - agent-capacity-codex
      - agent-capacity-export
      - agent-capacity-session
      - agent-capacity-spool
    canUse: [otel, otel-root, testify]
  agent-capacity-capacity:
    mayDependOn: [agent-capacity-capacity]
    canUse: [testify]
  agent-capacity-keepalive:
    mayDependOn: [agent-capacity-keepalive]
    canUse: [testify]
  agent-capacity-export:
    mayDependOn: [agent-capacity-capacity, agent-capacity-export]
    canUse: [otel, testify]
  agent-capacity-codex:
    mayDependOn: [agent-capacity-capacity, agent-capacity-codex, agent-capacity-spool]
    canUse: [testify]
  agent-capacity-session:
    mayDependOn: [agent-capacity-session, agent-capacity-spool]
    canUse: [pty, sys]
  agent-capacity-spool:
    mayDependOn: [agent-capacity-spool, agent-capacity-capacity]
    canUse: [testify]
  agent-capacity-claude:
    mayDependOn: [agent-capacity-claude, agent-capacity-spool, agent-capacity-capacity]
    canUse: [testify]
  agent-capacity-agy:
    mayDependOn: [agent-capacity-agy, agent-capacity-spool, agent-capacity-capacity]
    canUse: [testify]
  metrics-cmd:
    mayDependOn:
      - metrics-appauth
      - metrics-budget
      - metrics-ghclient
      - metrics-receiver
      - metrics-reconcile
      - metrics-recorder
      - metrics-store
      - metrics-telemetry
      - metrics-worker
    canUse: [otel]
  metrics-appauth:
    mayDependOn: [metrics-appauth, metrics-ghclient]
  metrics-backfill:
    mayDependOn: [metrics-backfill, metrics-budget, metrics-ghclient]
  metrics-budget:
    mayDependOn: [metrics-budget]
  metrics-ghclient:
    mayDependOn: [metrics-budget, metrics-ghclient]
  metrics-receiver:
    mayDependOn: [metrics-receiver, metrics-store]
  metrics-reconcile:
    mayDependOn: [metrics-budget, metrics-ghclient, metrics-reconcile, metrics-recorder]
    canUse: [otel]
  metrics-recorder:
    mayDependOn: [metrics-recorder]
    canUse: [otel]
  metrics-store:
    mayDependOn: [metrics-store]
    canUse: [bbolt]
  metrics-telemetry:
    mayDependOn: [metrics-telemetry]
    canUse: [otel, otlp, protobuf]
  metrics-version:
    mayDependOn: [metrics-version]
  metrics-worker:
    mayDependOn: [metrics-store, metrics-worker]
