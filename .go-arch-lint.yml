---
# Import contracts for Go packages in this repository.
# The stdlib-only-front contract allows the front to import pure dispatch.
# The dispatch standard library allowlist lives in .golangci.yml.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  front: {in: factory/cli/cmd/tbhbdev}
  dispatch: {in: factory/cli/internal/dispatch}

deps:
  front:
    mayDependOn: [dispatch]
  dispatch:
    mayDependOn: [dispatch]
