[global]
disable = [
  "MD013",  # Line length — we don't hardwrap markdown.
]
respect_gitignore = true
exclude = [
  ".git",
  ".vale",
  "tmp",
  "LICENSE",
  "lib/rules/lint/tests/content/testdata",
]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD048]
style = "backtick"

[per-file-ignores]
"**/index.md" = ["MD004"]
# A PR body has no H1: GitHub shows the PR title above it.
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
"lib/rules/repo/baseline/files/.github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
