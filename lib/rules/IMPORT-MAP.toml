replace = [
    ["# No default owners, so GitHub requests no reviewer automatically.\n*\n", "# SPDX-License-Identifier: Apache-2.0\n# Copyright Tony Burns\n\n# Shared Bazel build, test, and repository checks.\n# Depends on sibling rules modules and third-party Bazel modules.\n@tbhb\n"],
]

[rewrite."BUILD.bazel"]
dest = "lib/rules/BUILD.bazel"
replace = [
    ["# Copyright Tony Burns\n\nload(\"@bazelrc-preset.bzl\", \"bazelrc_preset\")\nload(\"@buildifier_prebuilt//:rules.bzl\", \"buildifier\", \"buildifier_test\")\nload(\"//format:defs.bzl\", \"format\", \"format_test\", \"formatter\")\nload(\n    \"//lint:defs.bzl\",\n    \"actionlint_test\",\n    \"claude_settings_test\",\n    \"cspell_test\",\n    \"decision_records_test\",\n    \"editorconfig_checker_test\",\n    \"gitleaks_history\",\n    \"gitleaks_test\",\n    \"mutation_oses_test\",\n    \"okf_docs_test\",\n    \"required_status_checks_test\",\n    \"reuse_test\",\n    \"rumdl_test\",\n    \"ryl_test\",\n    \"tombi_test\",\n    \"tree_check_test\",\n    \"workflow_lint_test\",\n    \"zizmor_test\",\n)\nload(\"//lint:repo_check_targets.bzl\", \"repo_check_targets\")\n", "# Copyright Tony Burns\n\nload(\"@bazel_skylib//rules:copy_file.bzl\", \"copy_file\")\nload(\"@bazel_skylib//rules:diff_test.bzl\", \"diff_test\")\nload(\"@bazelrc-preset.bzl\", \"generate_preset\")\nload(\"@buildifier_prebuilt//:rules.bzl\", \"buildifier\", \"buildifier_test\")\nload(\"//format:defs.bzl\", \"format\", \"format_test\", \"formatter\")\nload(\n    \"//lint:defs.bzl\",\n    \"cspell_test\",\n    \"decision_records_test\",\n    \"editorconfig_checker_test\",\n    \"gitleaks_history\",\n    \"gitleaks_test\",\n    \"mutation_oses_test\",\n    \"okf_docs_test\",\n    \"rumdl_test\",\n    \"ryl_test\",\n    \"tombi_test\",\n    \"tree_check_test\",\n)\nload(\"//lint:repo_check_targets.bzl\", \"repo_check_targets\")\n"],
    ["])\n\n# For //repo/tests:archive_actions_test.\nexports_files(\n    [\".gitattributes\"],\n    visibility = [\"//repo/tests:__pkg__\"],\n)\n\n# For //repo/tests:retry_budget_test.\nexports_files(\n    [\".github/workflows/repo-checks.yml\"],\n    visibility = [\"//repo/tests:__pkg__\"],\n)\n\n# For //repo/tests:cpu_quota_test.\nexports_files(\n    [\".github/actions/setup-bazel-ci/cpu_quota.sh\"],\n    visibility = [\"//repo/tests:__pkg__\"],\n)\n\n# For //repo/tests:affected_targets_test.\nexports_files(\n    [\n        \".github/actions/affected-targets/action.yml\",\n        \".github/actions/affected-targets/select.sh\",\n    ],\n    visibility = [\"//repo/tests:__pkg__\"],\n)\n\n# For //lint/tests's coined-terms fixture.\nexports_files(\n    [\".vale/project/CoinedTerms.yml\"],\n    visibility = [\"//lint/tests:__pkg__\"],\n)\n\n# For the Vale tools and the settings and baseline manifest tests.\nexports_files(\n    [\n        \".vale.ini\",\n        \"pyproject.toml\",\n    ],\n    visibility = [\n        \"//lint/private/claude_settings:__pkg__\",\n", "])\n\n# Stage monorepo lint configuration in the module-relative tree assembled by\n# the lint tests. The source of each file lives at the monorepo root.\n_VALE_STYLES = [\n    \".vale/config/vocabularies/project/accept.txt\",\n    \".vale/config/vocabularies/project/reject.txt\",\n    \".vale/project/Acronyms.yml\",\n    \".vale/project/CoinedTerms.yml\",\n    \".vale/project/Colons.yml\",\n    \".vale/project/HeadingTitleCase.yml\",\n    \".vale/project/WordList.yml\",\n]\n\n[\n    copy_file(\n        name = \"stage_\" + path.replace(\"/\", \"_\"),\n        src = \"@@//:\" + path,\n        out = path,\n        visibility = [\n            \"//lint/tests:__pkg__\",\n            \"//tools:__pkg__\",\n        ],\n    )\n    for path in _VALE_STYLES + [\n        \".cspell-words.txt\",\n        \".cspell.jsonc\",\n        \".github/schemas/pull-request-draft.schema.json\",\n        \".gitignore\",\n        \".