    ["\n# Only test packages load rules_testing.\nbazel_dep(name = \"rules_testing\", version = \"0.9.0\", dev_dependency = True)\n\n# The Python gates for this repository's own Python (tools/, runtime/private,\n# lint/private/okf_docs) come from the nested tbhb_rules_python module, over\n# the root uv project (pyproject.toml, uv.lock).\nbazel_dep(name = \"tbhb_rules_python\", version = \"0.0.0\", dev_dependency = True)\nlocal_path_override(\n    module_name = \"tbhb_rules_python\",\n    path = \"python\",\n)\n\npython = use_extension(\"@tbhb_rules_python//:extensions.bzl\", \"python\", dev_dependency = True)\npython.project()\n\n# Pinned copies of the SchemaStore schemas that pyproject.toml's embedded\n", "\n# Only test packages load rules_testing.\nbazel_dep(name = \"rules_testing\", version = \"0.9.0\")\nbazel_dep(name = \"tbhb_rules_python\", version = \"0.0.0\")\nlocal_path_override(\n    module_name = \"tbhb_rules_python\",\n    path = \"python\",\n)\n\n# Pinned copies of the SchemaStore schemas that pyproject.toml's embedded\n"],
