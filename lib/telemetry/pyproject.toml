[project]
name = "tbhb-telemetry"
version = "0"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-sdk==1.45.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pyrefly]
search-path = ["src", "tests/unit"]

[tool.vulture]
ignore_decorators = ["@override"]
paths = ["src", "tests/unit"]

[tool.ruff.lint]
external = ["V"]

[tool.complexipy]
paths = ["src", "tests/unit"]
max-complexity-allowed = 15
