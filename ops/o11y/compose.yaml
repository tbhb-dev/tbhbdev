---
# The observability stack: Grafana, Loki, Tempo, Mimir and Grafana Alloy,
# with RustFS as the S3 object store. Run it from a configured release, which
# supplies every O11Y_* value through an env file. Prepare data directories
# and secrets on the host before Compose starts. That preparation will arrive
# as a tbhbops subcommand. Compose requires the mounted files and env_file
# before it loads its model.
#
# Keep this file loadable by Compose 2.20.1: no include, develop,
# start_interval or long-form env_file.
name: o11y

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

x-common: &common
  restart: unless-stopped
  logging: *logging

# @O11Y_FIXED_ADDRESSES@ begin
# gVisor needs hosts entries because it cannot use Docker's embedded DNS.
x-hosts: &hosts
  - ts:203.0.113.2
  - loki:203.0.113.3
  - tempo:203.0.113.4
  - mimir:203.0.113.5
  - alloy:203.0.113.6
  - grafana:203.0.113.7
# @O11Y_FIXED_ADDRESSES@ end
x-needs-buckets: &needs-buckets
  s3-buckets: {condition: service_completed_successfully}

x-needs-backends: &needs-backends
  loki: {condition: service_started, restart: true}
  tempo: {condition: service_started}
  mimir: {condition: service_started}

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # @O11Y_TS_HOSTNAME@ begin
  ts:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.2
        # @O11Y_FIXED_ADDRESSES@ end
    <<: *common
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    environment:
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:o11y
      TS_HOSTNAME: ${O11Y_TS_HOSTNAME:?}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # @O11Y_FIXED_ADDRESSES@ off begin
      TS_OUTBOUND_HTTP_PROXY_LISTEN: 0.0.0.0:1055
      # @O11Y_FIXED_ADDRESSES@ off end
      # @O11Y_FIXED_ADDRESSES@ begin
      # Mutually exclusive marker ranges leave one proxy binding after render.
      # yamllint disable-line rule:key-duplicates
      TS_OUTBOUND_HTTP_PROXY_LISTEN: 203.0.113.2:1055
      # @O11Y_FIXED_ADDRESSES@ end
    volumes:
      - ${O11Y_DATA_DIR:?}/ts:/var/lib/tailscale
      - ${O11Y_CONFIG_TS:?}/resolv.conf:/etc/resolv.conf:ro
    mem_limit: 256m

    # @O11Y_TS_HOSTNAME@ end
  rustfs:
    <<: *common
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    stop_grace_period: 30s
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      # RustFS starts on a well-known default login when no key is set. The
      # file variables make its entrypoint fail on a missing or empty file.
      RUSTFS_ACCESS_KEY_FILE: /run/o11y/rustfs.access_key
      RUSTFS_SECRET_KEY_FILE: /run/o11y/rustfs.secret_key
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_OBS_LOGGER_LEVEL: info
      # Metrics go to Alloy's unpublished self receiver. An empty endpoint
      # would force RustFS's OpenTelemetry stdout exporters on, so it is set
      # here, and the stdout settings are explicit because their defaults
      # change outside production. The application log stays on stdout as
      # JSON; traces, OTLP logs and profiles are not exported.
      RUSTFS_OBS_ENDPOINT: http://alloy:4320
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_SERVICE_NAME: rustfs
      RUSTFS_OBS_USE_STDOUT: "false"
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_PROFILING_EXPORT_ENABLED: "false"
      RUSTFS_SCANNER_SPEED: slow
      RUSTFS_SCANNER_CYCLE: "3600"
      RUSTFS_UNSUPPORTED_FS_POLICY: fail
    volumes:
      - ${O11Y_DATA_DIR:?}/rustfs:/data
      - ${O11Y_DATA_DIR:?}/secrets/rustfs.access_key:/run/o11y/rustfs.access_key:ro
      - ${O11Y_DATA_DIR:?}/secrets/rustfs.secret_key:/run/o11y/rustfs.secret_key:ro
    mem_limit: 768m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]

  s3-buckets:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: "no"
    logging: *logging
    env_file: ${O11Y_S3_ENV_FILE:?}
    entrypoint: ["/bin/sh", "/buckets/buckets.sh"]
    volumes:
      - ${O11Y_CONFIG_BUCKETS:?}:/buckets:ro
    depends_on:
      rustfs: {condition: service_healthy}

  loki:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.3
        # @O11Y_FIXED_ADDRESSES@ end
    <<: *common
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    env_file: ${O11Y_S3_ENV_FILE:?}
    environment:
      O11Y_LOKI_WAL_DISK_FULL_THRESHOLD: ${O11Y_LOKI_WAL_DISK_FULL_THRESHOLD:-0.90}
    volumes:
      - ${O11Y_CONFIG_LOKI:?}:/etc/loki:ro
      - ${O11Y_DATA_DIR:?}/loki:/loki
    mem_limit: 1g
    depends_on: *needs-buckets
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/bin/loki", "-health", "-health.url=http://127.0.0.1:3100/ready"]

  tempo:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.4
        # @O11Y_FIXED_ADDRESSES@ end
    <<: *common
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    user: "10001:10001"
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    env_file: ${O11Y_S3_ENV_FILE:?}
    volumes:
      - ${O11Y_CONFIG_TEMPO:?}:/etc/tempo:ro
      - ${O11Y_DATA_DIR:?}/tempo:/var/tempo
    mem_limit: 1g
    depends_on:
      <<: *needs-buckets
      mimir: {condition: service_started}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]

  mimir-health-tools:
    image: busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    restart: "no"
    logging: *logging
    command:
      - sh
      - -ec
      - >-
          cp /bin/busybox /o11y-health/busybox.tmp &&
          chmod 0555 /o11y-health/busybox.tmp &&
          mv /o11y-health/busybox.tmp /o11y-health/busybox
    volumes:
      - mimir-health-tools:/o11y-health

  mimir:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.5
        # @O11Y_FIXED_ADDRESSES@ end
    <<: *common
    image: grafana/mimir:3.2.6@sha256:32d79dc873a804d4dbf2724afcbb7b141553b5ed9118f9295972c4bb2982d6fd
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    env_file: ${O11Y_S3_ENV_FILE:?}
    volumes:
      - ${O11Y_CONFIG_MIMIR:?}:/etc/mimir:ro
      - ${O11Y_DATA_DIR:?}/mimir:/data
      - mimir-health-tools:/o11y-health:ro
    mem_limit: 2g
    depends_on:
      <<: *needs-buckets
      mimir-health-tools: {condition: service_completed_successfully}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/o11y-health/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]

  alloy:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.6
        # @O11Y_FIXED_ADDRESSES@ end
    <<: *common
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      # Only for otelcol.processor.deltatocumulative; see config.alloy.
      - --stability.level=experimental
    # The Go runtime collects harder below this soft target, ahead of the
    # kernel's mem_limit. The grace period lets a stop with healthy backends
    # drain the queues.
    environment:
      GOMEMLIMIT: 600MiB
      O11Y_CLUSTER: ${O11Y_CLUSTER:-o11y}
      # Stamped on the stack's own OTLP metrics in place of whatever a
      # container reports. Supply the private host name through the environment.
      O11Y_HOST_NAME: ${O11Y_HOST_NAME:-unknown-host}
      O11Y_ENVIRONMENT: ${O11Y_ENVIRONMENT:-production}
    stop_grace_period: 30s
    volumes:
      - ${O11Y_CONFIG_ALLOY:?}:/etc/alloy:ro
      - ${O11Y_DATA_DIR:?}/alloy:/var/lib/alloy/data
    # Loopback only, and not configurable: whatever fronts the stack reaches it
    # on the host; Grafana trusts identity headers from that path.
    ports:
      - "127.0.0.1:${O11Y_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${O11Y_OTLP_HTTP_PORT:-4318}:4318"
    mem_limit: 768m
    depends_on:
      <<: *needs-backends
      grafana-owner: {condition: service_completed_successfully}
    healthcheck:
      <<: *healthcheck
      # The image has bash and no HTTP client.
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
            exec 3<>/dev/tcp/127.0.0.1/12345 &&
            printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 &&
            read -r status <&3 &&
            [[ $$status == *" 200 "* ]]

  # @O11Y_GRAFANA_TLS_CERT_DIR@ begin
  grafana-tls:
    <<: *common
    # @O11Y_FIXED_ADDRESSES@ begin
    networks:
      default:
        ipv4_address: 203.0.113.9
        # @O11Y_FIXED_ADDRESSES@ end
    image: nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    command: ["nginx", "-c", "/etc/nginx/grafana-tls.conf", "-g", "daemon off;"]
    volumes:
      - ${O11Y_CONFIG_GRAFANA_TLS:?}/nginx.conf:/etc/nginx/grafana-tls.conf:ro
      - type: bind
        source: ${O11Y_GRAFANA_TLS_CERT_DIR:?}
        target: /tls
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      <<: *healthcheck
      test: [CMD, nginx, -t, -c, /etc/nginx/grafana-tls.conf]
    mem_limit: 128m
    depends_on:
      grafana: {condition: service_healthy}

      # @O11Y_GRAFANA_TLS_CERT_DIR@ end
  grafana:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.7
        # @O11Y_FIXED_ADDRESSES@ end
    <<: *common
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    user: "472:472"
    entrypoint: ["/bin/sh", "/etc/o11y-grafana/entrypoint.sh"]
    environment:
      GF_SERVER_ROOT_URL: ${O11Y_GRAFANA_ROOT_URL:?}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: Tailscale-User-Login
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/o11y/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/o11y-grafana/provisioning
      # Email alerts require a recipient and SMTP configuration. The
      # password is read from its file and is empty while email is off.
      GF_SMTP_ENABLED: ${O11Y_ALERT_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${O11Y_ALERT_SMTP_HOST:-}:${O11Y_ALERT_SMTP_PORT:-}
      GF_SMTP_USER: ${O11Y_ALERT_SMTP_USER:-}
      GF_SMTP_PASSWORD__FILE: /run/o11y/alert_smtp_password
      GF_SMTP_FROM_ADDRESS: ${O11Y_ALERT_SMTP_FROM:-}
      GF_SMTP_FROM_NAME: o11y
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_SMTP_SKIP_VERIFY: ${O11Y_ALERT_SMTP_SKIP_VERIFY:-false}
      O11Y_ALERT_EMAIL_TO: ${O11Y_ALERT_EMAIL_TO:-}
    volumes:
      - ${O11Y_CONFIG_GRAFANA:?}:/etc/o11y-grafana:ro
      - ${O11Y_CONFIG_GRAFANA:?}/resolv.conf:/etc/resolv.conf:ro
      - ${O11Y_DATA_DIR:?}/grafana:/var/lib/grafana
      - ${O11Y_DATA_DIR:?}/secrets/grafana_admin_password:/run/o11y/grafana_admin_password:ro
      - ${O11Y_DATA_DIR:?}/secrets/grafana_agents_password:/run/o11y/grafana_agents_password:ro
      # Read by the contact point in provisioning/alerting/alerting.yaml.
      - ${O11Y_DATA_DIR:?}/secrets/alert_discord_webhook_url:/run/o11y/alert_discord_webhook_url:ro
      - ${O11Y_DATA_DIR:?}/secrets/alert_smtp_password:/run/o11y/alert_smtp_password:ro
    ports:
      - "127.0.0.1:${O11Y_GRAFANA_PORT:-3000}:3000"
    mem_limit: 768m
    depends_on:
      <<: *needs-backends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]

  grafana-owner:
    # @O11Y_FIXED_ADDRESSES@ begin
    extra_hosts: *hosts
    networks:
      default:
        ipv4_address: 203.0.113.8
        # @O11Y_FIXED_ADDRESSES@ end
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    user: "472:472"
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "/etc/o11y-grafana/owner.sh"]
    environment:
      O11Y_GRAFANA_OWNER_LOGIN: ${O11Y_GRAFANA_OWNER_LOGIN:?}
    volumes:
      - ${O11Y_CONFIG_GRAFANA:?}:/etc/o11y-grafana:ro
      - ${O11Y_DATA_DIR:?}/secrets/grafana_admin_password:/run/o11y/grafana_admin_password:ro
      - ${O11Y_DATA_DIR:?}/secrets/grafana_agents_password:/run/o11y/grafana_agents_password:ro
    depends_on:
      grafana: {condition: service_healthy}

volumes:
  mimir-health-tools:
# @O11Y_FIXED_ADDRESSES@ begin

networks:
  default:
    ipam:
      config:
        - subnet: 203.0.113.0/24
          ip_range: 203.0.113.128/25
# @O11Y_FIXED_ADDRESSES@ end
