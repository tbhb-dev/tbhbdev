  - orgId: 1
    name: ca-backup
    folder: o11y
    interval: 1m
    rules:
      - uid: ca-backup-unhealthy
        title: CA backup failed or overdue
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: KeepLast
        labels: {service: ca-backup, severity: high, env: prd, host: nas-a}
        annotations:
          summary: The CA backup on nas-a failed or has gone 26 hours without a success.
          description: >-
            On nas-a, check the 03:15 root cron entry in /etc/crontab.
            Review the last backup result, verify step-ca health, and check that
            the job can reach the metrics collector.
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                ((max(last_over_time(ca_backup_last_run_failed{host="nas-a"}[26h])) or vector(0)) > bool 0)
                + (time() - (max(last_over_time(ca_backup_last_success_or_start_timestamp_seconds{
                host="nas-a"}[26h])) or vector(0)) >= bool 93600)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
