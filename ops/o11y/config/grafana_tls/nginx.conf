worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server {
    # @O11Y_FIXED_ADDRESSES@ off begin
    listen 8443 ssl;
    # @O11Y_FIXED_ADDRESSES@ off end
    # @O11Y_FIXED_ADDRESSES@ begin
    listen 203.0.113.9:8443 ssl;
    # @O11Y_FIXED_ADDRESSES@ end
    server_name grafana.example.invalid;
    ssl_certificate /tls/grafana.crt.pem;
    ssl_certificate_key /tls/grafana.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      # @O11Y_FIXED_ADDRESSES@ off begin
      proxy_pass http://grafana:3000;
      # @O11Y_FIXED_ADDRESSES@ off end
      # @O11Y_FIXED_ADDRESSES@ begin
      proxy_pass http://203.0.113.7:3000;
      # @O11Y_FIXED_ADDRESSES@ end
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
