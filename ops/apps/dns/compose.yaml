---
# The network resolver, one copy on each NAS. Host networking, so the server sees
# each query's real source address, which the views depend on.
name: dns

services:
  coredns:
    # Release 1.15.0 from https://hub.docker.com/r/coredns/coredns/tags?name=1.15
    # (the design needs 1.14.5 or later, for DNS over HTTPS in forward).
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    command: ["-conf", "/etc/coredns/Corefile"]
    network_mode: host
    # The image runs as root and has no shell. Keep only the capability that
    # binds port 53.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 256m
    restart: unless-stopped
    # The query log goes to standard output. Keep three files of 10 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      # The LAN and tailnet addresses of this NAS to listen on, one variable each.
      # The Corefile writes them as two bind arguments, because CoreDNS keeps a
      # variable's value as one token.
      DNS_BIND_LAN: ${DNS_BIND_LAN:?Set the NAS LAN address to listen on}
      DNS_BIND_TAILNET: ${DNS_BIND_TAILNET:?Set the NAS tailnet address to listen on}
      # Quoted, comma-separated tailnet addresses of the LAN servers, such as
      # 'a.b.c.d'. Empty when there are none.
      DNS_LAN_TAILNET_ADDRS: ${DNS_LAN_TAILNET_ADDRS:-}
    volumes:
      # The directory, not the file: a single-file bind mount keeps the old inode
      # after a copy replaces the file, so the container would miss the change.
      - ${DNS_CONFIG_DIR:?Set the companion DNS config directory}:/etc/coredns:ro
      - ${DNS_ZONES_DIR:?Set the companion DNS zone directory}:/zones:ro
