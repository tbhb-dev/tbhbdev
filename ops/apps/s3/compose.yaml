---
# One RustFS store per NAS, as two S3 regions linked by site replication.
# Deploy it on nas-a and nas-b with that host's own values.
#
# Interim mode, the default: plain HTTP on TCP 9000, reached only over the
# tailnet. The store binds S3_BIND_ADDR, which is the host's tailnet address
# and comes from compose.env. Ops' read of the live host on 2026-11-14 shows the
# running container publishing TCP 9000 on that address. The code default is
# loopback, 127.0.0.1, when S3_BIND_ADDR is unset. Nothing rejects a wildcard
# S3_BIND_ADDR, so the operator checks compose.env before `up`.
#
# Setting S3_TLS=1 switches the store to TLS on this NAS's LAN address with the
# *.s3.example.invalid certificate, and turns on the peer name.
name: s3

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  rustfs:
    <<: *hardening
    # Release 1.0.4 from https://hub.docker.com/r/rustfs/rustfs/tags?name=1.0.4
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    # The image's rustfs user; pre-own data, the key files and the certificate
    # directory at deploy.
    user: "10001:10001"
    stop_grace_period: 30s
    mem_limit: 2g
    # pids_limit and logging are additions the live container doesn't have yet,
    # so the live compose differs from this copy until the next recreate.
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      # Loopback when S3_BIND_ADDR is unset. By convention the operator also
      # sets S3_BIND_ADDR when setting S3_TLS=1; Compose can't enforce that.
      - "${S3_BIND_ADDR:-127.0.0.1}:9000:9000/tcp"
    # With S3_TLS=1 the peer is reached by name with no DNS, so a joint restart
    # of both NAS hosts can't wait on the resolver that boots beside them. The
    # defaults keep the entry valid in interim mode and point nowhere real.
    extra_hosts:
      - "${S3_PEER_NAME:-peer.invalid}:${S3_PEER_ADDR:-127.0.0.1}"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      # RustFS starts on a well-known default login when no key is set. The
      # file variables make its entrypoint fail on a missing or empty file.
      RUSTFS_ACCESS_KEY_FILE: /run/s3/rustfs.access_key
      RUSTFS_SECRET_KEY_FILE: /run/s3/rustfs.secret_key
      # With S3_TLS=1 the directory holds rustfs_cert.pem and rustfs_key.pem.
      RUSTFS_TLS_PATH: ${S3_TLS:+/tls}
      # lego replaces the files in place and RustFS reads them only at start
      # unless reload is on. Source: rustfs 1.0.4 crates/config/src/constants/
      # tls.rs, ENV_TLS_RELOAD_ENABLE (default false) and ENV_TLS_RELOAD_INTERVAL
      # (default 30 s, minimum 5 s); rustfs/src/server/tls_material.rs
      # spawn_reload_loop re-reads RUSTFS_TLS_PATH and swaps the acceptor when
      # the material's fingerprint changes. Unused in interim mode.
      RUSTFS_TLS_RELOAD_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_OBS_LOGGER_LEVEL: info
      # Metrics go to Alloy over OTLP when S3_OBS_ENDPOINT is set. An empty
      # endpoint turns RustFS's stdout exporters on, which the interim accepts.
      # The stdout settings are explicit because their defaults change outside
      # production.
      RUSTFS_OBS_ENDPOINT: ${S3_OBS_ENDPOINT:-}
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_SERVICE_NAME: rustfs
      RUSTFS_OBS_USE_STDOUT: "false"
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_PROFILING_EXPORT_ENABLED: "false"
      RUSTFS_UNSUPPORTED_FS_POLICY: fail
    volumes:
      - ${S3_DATA_DIR:-./data}:/data
      - ${S3_TLS_DIR:-./tls}:/tls:ro
      - type: bind
        source: ${S3_SECRETS_DIR:-./secrets}/rustfs.access_key
        target: /run/s3/rustfs.access_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${S3_SECRETS_DIR:-./secrets}/rustfs.secret_key
        target: /run/s3/rustfs.secret_key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # The certificate names the region, not the loopback address, and the
      # plain HTTP probe covers interim mode.
      test:
        - CMD-SHELL
        - >-
            curl -fsSk https://127.0.0.1:9000/health/ready ||
            curl -fsS http://127.0.0.1:9000/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  lego:
    <<: *hardening
    # Off unless S3_TLS=1: the weekly DSM task runs it with `--profile cert`,
    # and `up` never starts it.
    profiles: [cert]
    image: goacme/lego:v5.7.0@sha256:9fe6151508c0e1ddc51a6d3e474353520f4b008782bf0c6d31676da72e6d4766
    user: "10001:10001"
    restart: "no"
    mem_limit: 256m
    # Additions the live container doesn't have yet, as on rustfs.
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
          set -f
          crt=/lego/certificates/_.example.invalid
          if [ -f "$$crt.crt" ]; then action="renew --days 30"; else action=run; fi
          lego --path /lego --accept-tos --email "$$ACME_EMAIL" --dns cloudflare \
            --domains '*.s3.example.invalid' $$action
          umask 077
          cp "$$crt.crt" /tls/rustfs_cert.pem.tmp
          cp "$$crt.key" /tls/rustfs_key.pem.tmp
          mv -f /tls/rustfs_cert.pem.tmp /tls/rustfs_cert.pem
          mv -f /tls/rustfs_key.pem.tmp /tls/rustfs_key.pem
    environment:
      ACME_EMAIL: ${S3_ACME_EMAIL:-}
      CLOUDFLARE_DNS_API_TOKEN_FILE: /run/s3/lego-dns-token
    volumes:
      - ${S3_ACME_DIR:-./lego}:/lego
      - ${S3_TLS_DIR:-./tls}:/tls
      - type: bind
        source: ${S3_SECRETS_DIR:-./secrets}/lego-dns-token
        target: /run/s3/lego-dns-token
        read_only: true
        bind:
          create_host_path: false
