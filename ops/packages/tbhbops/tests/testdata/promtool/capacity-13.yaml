---
evaluation_interval: 1m
rule_files:
  - rules.yaml
tests:
  - alert_rule_test:
      - alertname: o11y-capacity-warn
        eval_time: 24h
        exp_alerts: []
      - alertname: o11y-capacity-shed
        eval_time: 24h
        exp_alerts: []
      - alertname: o11y-capacity-stop
        eval_time: 24h
        exp_alerts: []
      - alertname: o11y-capacity-exhaustion
        eval_time: 24h
        exp_alerts: []
      - alertname: o11y-capacity-stale
        eval_time: 24h
        exp_alerts: []
    input_series: []
    interval: 1m
    name: no capacity series
