          \ agent_capacity_source=~\"claude_statusline|claude_transcript|codex_rollout|codex_probe|agy_statusline\"\
          , agent_capacity_freshness=\"carried\"\
          }[15m]))))) >= 0.85"
        for: 10m
        labels:
          env: prd
          service: agent-capacity
          severity: warning
      - alert: o11y-capacity-stop
        expr: "(max by (agent_plan_vendor,\
          \ agent_plan_window, agent_account)\
          \ ((max by (agent_plan_vendor, agent_plan_window,\
          \ agent_account, agent_plan_bucket)\
