          \ agent_capacity_source=~\"claude_statusline|claude_transcript|codex_rollout|codex_probe|agy_statusline\"\
          , agent_capacity_freshness=\"fresh\"\
          }[15m])) or max by (agent_plan_vendor,\
          \ agent_plan_window, agent_account,\
          \ agent_plan_bucket) (last_over_time(\
