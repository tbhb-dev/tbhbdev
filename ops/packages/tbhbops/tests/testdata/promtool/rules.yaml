          , agent_capacity_freshness=\"carried\"\
          }[15m]))))) >= 0.9"
        for: 2m
        labels:
          env: prd
          service: agent-capacity
          severity: critical
      - alert: o11y-capacity-exhaustion
        expr: "((((deriv(max by (agent_plan_vendor,\
          \ agent_plan_window, agent_account)\
          \ ((max by (agent_plan_vendor, agent_plan_window,\
          \ agent_account, agent_plan_bucket)\
          \ (agent_capacity_window_utilization_ratio{agent_plan_window=\"\
