          claude_statusline|claude_transcript|codex_rollout|codex_probe|agy_statusline\"\
          , agent_capacity_freshness=\"carried\"\
          })))[24h:5m]) > 0) and on (agent_plan_vendor,\
          \ agent_plan_window, agent_account)\
          \ ((1 - max by (agent_plan_vendor,\
          \ agent_plan_window, agent_account)\
          \ ((max by (agent_plan_vendor, agent_plan_window,\
          \ agent_account, agent_plan_bucket)\
          \ (last_over_time( agent_capacity_window_utilization_ratio{agent_plan_window=\"\
