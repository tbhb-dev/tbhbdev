---
evaluation_interval: 1m
rule_files:
  - rules.yaml
tests:
  - alert_rule_test:
      - alertname: o11y-capacity-exhaustion
        eval_time: 10h
        exp_alerts: []
      - alertname: o11y-capacity-exhaustion
        eval_time: 24h
        exp_alerts:
          - exp_annotations: {}
            exp_labels:
              agent_account: primary
              agent_plan_vendor: anthropic
              agent_plan_window: 7d
              env: prd
              service: agent-capacity
              severity: high
    input_series:
      - series: "agent_capacity_window_utilization_ratio{agent_plan_vendor=\"\
          anthropic\",agent_plan_window=\"\
          7d\",agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 0.10+0.002x288
      - series: "agent_capacity_window_reset_time_seconds{agent_plan_vendor=\"\
          anthropic\",agent_plan_window=\"\
          7d\",agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 604800x288
      - series: "agent_capacity_window_utilization_ratio{agent_plan_vendor=\"\
          openai\",agent_plan_window=\"7d\"\
          ,agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 0.50x288
      - series: "agent_capacity_window_reset_time_seconds{agent_plan_vendor=\"\
          openai\",agent_plan_window=\"7d\"\
          ,agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 604800x288
      - series: "agent_capacity_window_utilization_ratio{agent_plan_vendor=\"\
          google\",agent_plan_window=\"7d\"\
          ,agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 0.90-0.002x288
      - series: "agent_capacity_window_reset_time_seconds{agent_plan_vendor=\"\
          google\",agent_plan_window=\"7d\"\
          ,agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 604800x288
      - series: "agent_capacity_window_utilization_ratio{agent_plan_vendor=\"\
          anthropic\",agent_plan_window=\"\
          7d\",agent_account=\"secondary\"\
          ,host_name=\"fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 0.20+0.0002x288
      - series: "agent_capacity_window_reset_time_seconds{agent_plan_vendor=\"\
          anthropic\",agent_plan_window=\"\
          7d\",agent_account=\"secondary\"\
          ,host_name=\"fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 100000x288
      - series: "agent_capacity_window_utilization_ratio{agent_plan_vendor=\"\
          anthropic\",agent_plan_window=\"\
          5h\",agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 0.10+0.002x288
      - series: "agent_capacity_window_reset_time_seconds{agent_plan_vendor=\"\
          anthropic\",agent_plan_window=\"\
          5h\",agent_account=\"primary\",host_name=\"\
          fixture-a\",agent_capacity_source=\"\
          claude_statusline\",agent_capacity_freshness=\"\
          fresh\"}"
        values: 604800x288
    interval: 5m
    name: "five-hour window and non-exhausting\
      \ seven-day slopes excluded alongside\
      \ firing weekly window"
