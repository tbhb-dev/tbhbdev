[project]
name = "tbhbops-mcp"
version = "0"
description = "MCP server for the tbhb-dev/tbhbdev tools"
requires-python = ">=3.15"
dependencies = [
  "mcp>=2.3.0",
]

[project.scripts]
tbhbops-mcp = "tbhbops_mcp.cli:main"

# mutmut runs from this directory, because it maps a mutated file to its
# module name only under src/.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.pytest]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
