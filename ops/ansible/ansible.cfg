# Relative paths resolve against this file's directory. The ops tasks
# and Molecule pass the inventories, so none is configured here.
[defaults]
collections_path = collections
roles_path = roles
# Local plugins: Ansible looks only beside a playbook and in ~/.ansible by default.
filter_plugins = plugins/filter
host_key_checking = True
interpreter_python = auto_silent

# One SSH session per task instead of several. The ops runs turn
# connection reuse off, so each session costs a full handshake.
[connection]
pipelining = True

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentityAgent=none
