---
# cspell:ignore publickey
# Add the controller keys to existing CI VMs and prove a fresh controller
# login before removing lab-ops. Replace controller source options with the
# lab gateway, then prove lab-ops is refused on the VM hop while the jump hop
# uses the controller key. Keep other keys and the inventory's host key pinning.
# Both proofs skip check mode:
#   mise run playbook -- playbooks/ci-vm-admin-keys.yml --check --diff
- name: Authorize the controller keys on the CI VMs
  hosts: ci
  gather_facts: false
  become: true
  vars:
    # CI VMs are outside agent_hosts; read the refusal list from their lab node.
    ops_lab_ops_keys: "{{ hostvars[inventory_hostname | regex_replace('-ci$', '')].ops_lab_ops_keys }}"
  tasks:
    - name: Add the controller keys to ops
      ansible.posix.authorized_key:
        user: ops
        key: "{{ item }}"
        exclusive: false
        state: present
      loop: "{{ ci_vm_controller_keys }}"

    - name: Prove a fresh ops login with the controller key
      ansible.builtin.command:
        cmd: >-
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes
          -o IdentityAgent=none -o ConnectTimeout=10
          -i {{ ssh_controller_key_path | expanduser | quote }}
          {{ ansible_ssh_common_args }} ops@{{ ansible_host }} true
      vars:
        ci_vm_jump_key_path: "{{ ssh_controller_key_path }}"
      delegate_to: localhost
      become: false
      register: ci_vm_admin_keys_proof
      changed_when: false
      failed_when: ci_vm_admin_keys_proof.rc != 0
      when: not ansible_check_mode

    # authorized_key in ansible.posix 2.2.2 matches absent keys by body,
    # including installed lines with source options or a different comment.
    - name: Remove the shared lab-ops key from ops
      ansible.posix.authorized_key:
        user: ops
        key: "{{ item }}"
        state: absent
      loop: "{{ ops_lab_ops_keys }}"

    - name: Prove the shared lab-ops key is refused on the VM hop
      ansible.builtin.command:
        cmd: >-
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes
          -o IdentityAgent=none -o ConnectTimeout=10
          -i {{ '~/.ssh/lab-ops' | expanduser | quote }}
          {{ ansible_ssh_common_args }} ops@{{ ansible_host }} true
      vars:
        ci_vm_jump_key_path: "{{ ssh_controller_key_path }}"
      delegate_to: localhost
      become: false
      register: ci_vm_admin_keys_lab_ops_proof
      changed_when: false
      failed_when: >-
        ci_vm_admin_keys_lab_ops_proof.rc == 0 or
        'Permission denied (publickey' not in ci_vm_admin_keys_lab_ops_proof.stderr
      when: not ansible_check_mode
