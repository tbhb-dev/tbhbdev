---
# Schedule agent account settings reconverge every 15 minutes.
# The agent account on the agent hosts that no host playbook covers: the
# operator's Macs and host-f. lab-hosts.yml and lab-macos.yml run the
# same role on the lab nodes. The Macs need the operator's sudo password:
#   mise run playbook -- playbooks/agent-accounts.yml -K --check --diff
- name: Create the agent account on the other agent hosts
  hosts: agent_hosts:!lab:!lab_macos:!windows
  gather_facts: true
  become: true
  roles:
    - agent_account
    - agent_reconverge
    - codex_cli
    - claude_code
