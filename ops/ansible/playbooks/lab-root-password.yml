---
# The lab nodes' root break-glass passwords, for console logins only:
# ops_ssh keeps PermitRootLogin at no. Each node's password is the
# "lab NODE root" item in the lab-fixture vault of the tbhb-dev 1Password
# account, and reading it asks the 1Password app on the Mac that runs
# Ansible to approve:
#   mise run playbook -- playbooks/lab-root-password.yml --limit NODE --check
# The salt comes from the node's name, so each run produces the same hash
# and a rerun reports no change. A salt doesn't need to be secret.
- name: Set the lab nodes' root break-glass passwords
  hosts: lab
  gather_facts: false
  become: true
  vars:
    lab_root_password_salt: "{{ ((inventory_hostname ~ ' root') | hash('sha256'))[:16] }}"
  tasks:
    - name: Read root's password from 1Password
      ansible.builtin.set_fact:
        lab_root_password: >-
          {{ lookup('ansible.builtin.pipe',
                    'op read --no-newline --account ' ~ (lab_root_password_op_account | quote) ~ ' ' ~ (lab_root_password_ref | quote)) }}
      no_log: true

    - name: Refuse a password shorter than the generated 32 characters
      ansible.builtin.assert:
        that: lab_root_password | length >= 32
        quiet: true
      no_log: true

    - name: Set root's password
      ansible.builtin.user:
        name: root
        password: "{{ lab_root_password | password_hash('sha512', lab_root_password_salt) }}"
        update_password: always
      no_log: true
