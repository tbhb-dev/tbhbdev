---
# The lab nodes' host firewall, sysctl settings and mount options, one node
# at a time. A revert timer armed first restores the previous firewall after
# 3 minutes unless a fresh connection over the inventory name (the tailnet)
# works. Docker's "ip" setting is in docker_engine, so lab-hosts.yml applies
# it, and restarting Docker there stops running containers.
#   mise run playbook -- playbooks/lab-hardening.yml --limit NODE --check --diff
- name: Harden the lab nodes' hosts
  hosts: lab
  serial: 1
  gather_facts: false
  become: true
  tasks:
    - name: Prepare the firewall safety switch
      ansible.builtin.include_role:
        name: host_hardening
        tasks_from: prepare
        public: true

    # Arming saves the current table and leaves no other state.
    - name: Arm the firewall revert timer
      ansible.builtin.command:
        cmd: /usr/local/sbin/host-hardening-revert arm
      changed_when: false
      when: not ansible_check_mode

    - name: Apply host hardening
      ansible.builtin.include_role:
        name: host_hardening

    - name: Load the table and sysctl settings before reconnecting
      ansible.builtin.meta: flush_handlers

    - name: Close the existing connection
      ansible.builtin.meta: reset_connection
      when: not ansible_check_mode

    # A new connection over the inventory name proves the tailnet path
    # survives the table.
    - name: Confirm a fresh login over the tailnet
      ansible.builtin.wait_for_connection:
        timeout: 60
      become: false
      when: not ansible_check_mode

    - name: Cancel the firewall revert timer after the fresh login
      ansible.builtin.command:
        cmd: /usr/local/sbin/host-hardening-revert cancel
      changed_when: false
      when: not ansible_check_mode
