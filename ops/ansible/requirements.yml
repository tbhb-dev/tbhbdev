---
# Installed into the gitignored collections/ by molecule/run.sh, and pinned
# for the Bazel checks by requirements.lock.json.
# community.docker serves only Molecule's Docker driver, and
# community.library_inventory_filtering_v1 is its dependency, which the lock
# requires pinned. community.general gives lvm_volume its lvol and
# filesystem modules. ansible.windows gives
# windows_accounts its user, group, template and user-right modules.
collections:
  - name: ansible.posix
    version: 2.2.2
    source: https://galaxy.ansible.com/api/
  - name: community.general
    version: 14.0.1
    source: https://galaxy.ansible.com/api/
  - name: ansible.windows
    version: 3.9.2
    source: https://galaxy.ansible.com/api/
  - name: community.docker
    version: 5.4.0
    source: https://galaxy.ansible.com/api/
  - name: community.library_inventory_filtering_v1
    version: 1.1.5
    source: https://galaxy.ansible.com/api/
