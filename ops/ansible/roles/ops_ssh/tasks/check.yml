---
- name: check | Validate a temporary candidate without installing it
  block:
    - name: check | Create the check mode directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ops-ssh-check-
      register: ops_ssh_check
      check_mode: false
      changed_when: false

    - name: check | Render the check mode candidate
      ansible.builtin.template:
        src: sshd.conf.j2
        dest: "{{ ops_ssh_check.path }}/sshd.conf"
        mode: "0600"
      diff: false
      check_mode: false
      changed_when: false

    # The installed helper may not exist yet on a first check.
    - name: check | Validate the check mode candidate
      ansible.builtin.script:
        cmd: ops-sshd-validate.sh {{ ops_ssh_check.path }}/sshd.conf
      check_mode: false
      changed_when: false
  always:
    - name: check | Remove the check mode directory
      ansible.builtin.file:
        path: "{{ ops_ssh_check.path }}"
        state: absent
      when: ops_ssh_check.path is defined
      check_mode: false
      changed_when: false
