---
- name: Check the tbhbdev settings
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - ops_tbhbdev_uv_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - ops_tbhbdev_commit is match('^[0-9a-f]{40}$')
      - ops_tbhbdev_source is match('^https://[^\s@]+$')
      - ops_tbhbdev_connect_endpoints | length > 0
      - >-
          ops_tbhbdev_connect_endpoints | select('match', '^https://[a-zA-Z][a-zA-Z0-9.-]*$') | list ==
          ops_tbhbdev_connect_endpoints
    fail_msg: tbhbdev needs a pinned release and commit, and HTTPS tailnet hostnames without ports or addresses
    quiet: true

# mise where exits 1 when the version is missing. Other failures stop the play.
- name: Look for the pinned uv
  ansible.builtin.command:
    argv: ["{{ ops_tbhbdev_mise }}", where, "uv@{{ ops_tbhbdev_uv_version }}"]
    chdir: "{{ ops_tbhbdev_home }}"
  register: ops_tbhbdev_uv
  changed_when: false
  failed_when: ops_tbhbdev_uv.rc not in [0, 1]
  check_mode: false

- name: Install the pinned uv through mise
  ansible.builtin.command:
    argv: ["{{ ops_tbhbdev_mise }}", install, "uv@{{ ops_tbhbdev_uv_version }}"]
    chdir: "{{ ops_tbhbdev_home }}"
  when: ops_tbhbdev_uv.rc != 0
  changed_when: true

- name: Find the recorded tbhbdev install
  ansible.builtin.find:
    paths: "{{ ops_tbhbdev_tool_dir }}"
    patterns: direct_url.json
    recurse: true
  register: ops_tbhbdev_recorded

- name: Read the recorded tbhbdev commit
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  register: ops_tbhbdev_direct_url
  loop: >-
    {{ ops_tbhbdev_recorded.files |
    selectattr('path', 'match', '.*/tbhbdev-[^/]+\.dist-info/direct_url\.json$') | list }}
  loop_control:
    label: direct_url.json

- name: Compare the recorded commit with the pin
  ansible.builtin.set_fact:
    ops_tbhbdev_installed_commit: >-
      {{ (ops_tbhbdev_direct_url.results | map(attribute='content') | map('b64decode') | map('from_json') |
      map(attribute='vcs_info') | map(attribute='commit_id') | list | first) | default('') }}

- name: Install tbhbdev from the pinned commit
  ansible.builtin.command:
    argv:
      - "{{ ops_tbhbdev_mise }}"
      - exec
      - "uv@{{ ops_tbhbdev_uv_version }}"
      - --
      - uv
      - tool
      - install
      - --reinstall
      - "git+{{ ops_tbhbdev_source }}@{{ ops_tbhbdev_commit }}"
    chdir: "{{ ops_tbhbdev_home }}"
  environment:
    PATH: "{{ ops_tbhbdev_path }}"
    UV_TOOL_BIN_DIR: "{{ ops_tbhbdev_bin_dir }}"
  when: ops_tbhbdev_installed_commit != ops_tbhbdev_commit
  changed_when: true

- name: Create the tbhbdev config directory
  ansible.builtin.file:
    path: "{{ [ops_tbhbdev_home, '.config', 'tbhbdev'] | join('/') }}"
    state: directory
    mode: '0700'

- name: Resolve Connect endpoints for ops
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/connect-endpoints.yml"
  vars:
    connect_endpoints: "{{ ops_tbhbdev_connect_endpoints }}"

- name: Write the tbhbdev Connect config
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ [ops_tbhbdev_home, '.config', 'tbhbdev'] | join('/') }}/config.toml"
    mode: '0600'
  diff: false
  no_log: true
