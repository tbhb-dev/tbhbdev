---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: bazel-reaper-ubuntu-2604-${MOLECULE_RUN_ID:-local}
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
    privileged: true
    command: /sbin/init
    cgroupns_mode: private
    tmpfs: [/run, /tmp]
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
verifier:
  name: ansible
scenario:
  test_sequence: [destroy, syntax, create, check, converge, idempotence, verify, destroy]
