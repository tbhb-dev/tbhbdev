---
# The pool's role installs, registers and updates the runner. This role runs
# before it and writes two directories as the service user. The job directory
# is the one the pool mounts read-only into each job container: the job-started
# hook, the guard behind it and its settings. The secrets directory holds the
# private keys. No container mounts it: the pool's slot script carries its files
# to the guard through a FIFO, once per job, and the guard writes them into the
# job only after it admits it. Root, through ops' sudo, installs the package.

- name: Check the job guard settings
  ansible.builtin.assert:
    that:
      - actions_runner_pool_job_dir is defined
      - actions_runner_pool_job_dir | length > 0
      - actions_runner_pool_job_dir is not match('^/')
      - "'..' not in actions_runner_pool_job_dir.split('/')"
      - actions_runner_pool_job_started_hook is defined
      - actions_runner_pool_job_started_hook is match('^[A-Za-z0-9._-]+\.sh$')
      - actions_runner_pool_job_secrets_dir is defined
      - actions_runner_pool_job_secrets_dir | length > 0
      - actions_runner_pool_job_secrets_dir is not match('^/')
      - "'..' not in actions_runner_pool_job_secrets_dir.split('/')"
      # Neither directory is the other or inside it, or the job mount would hold the keys.
      - not (actions_runner_pool_job_secrets_dir ~ '/').startswith(actions_runner_pool_job_dir ~ '/')
      - not (actions_runner_pool_job_dir ~ '/').startswith(actions_runner_pool_job_secrets_dir ~ '/')
      - deploy_runner_guard_repository is match('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')
      - deploy_runner_guard_ref is match('^refs/heads/[A-Za-z0-9._/-]+$')
      - deploy_runner_guard_events | length > 0
      - deploy_runner_guard_url is match('^[A-Za-z0-9@:/._-]+$')
      - deploy_runner_guard_host_key is match('^[A-Za-z0-9.-]+ ssh-ed25519 [A-Za-z0-9+/=]+$')
    fail_msg: >-
      The pool's job directory, a job-started hook ending in .sh and a secrets directory apart from it must be
      set, because the guard is that hook and the keys reach it through the secrets directory, and the
      guard's repository, reference, events, URL and host key must be valid
    quiet: true

- name: Install the tool that makes the keys
  ansible.builtin.apt:
    name: openssh-client
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ actions_runner_pool_user }}"
    fail_key: false

- name: Stop a check run at a service user it would create
  ansible.builtin.meta: end_role
  when: ansible_check_mode and ansible_facts.getent_passwd[actions_runner_pool_user] is none

- name: Require the service user from docker_rootless
  ansible.builtin.assert:
    that: ansible_facts.getent_passwd[actions_runner_pool_user] is not none
    fail_msg: The service user doesn't exist; apply docker_rootless first
    quiet: true

- name: Record the job directory's path
  ansible.builtin.set_fact:
    deploy_runner_home: "{{ ansible_facts.getent_passwd[actions_runner_pool_user][4] }}"
    deploy_runner_job_dir: >-
      {{ ansible_facts.getent_passwd[actions_runner_pool_user][4] }}/{{ actions_runner_pool_job_dir }}
    deploy_runner_secrets_dir: >-
      {{ ansible_facts.getent_passwd[actions_runner_pool_user][4] }}/{{ actions_runner_pool_job_secrets_dir }}

- name: Write the job directory as the service user
  become: true
  become_user: "{{ actions_runner_pool_user }}"
  block:
    # The parents match the pool's own, which keep other users out of the home's
    # files. The job directory is the mount, so the container's user can read it.
    - name: Create the job directory
      ansible.builtin.file:
        path: "{{ deploy_runner_home }}/{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - {path: .config, mode: "0700"}
        - {path: .config/actions-runner, mode: "0700"}
        - {path: "{{ actions_runner_pool_job_dir }}", mode: "0755"}
        # Mode 0700, and in no mount: a job reaches these files only through the guard.
        - {path: "{{ actions_runner_pool_job_secrets_dir }}", mode: "0700"}
      loop_control:
        label: "{{ item.path }}"

    # The runner accepts only a .sh, .ps1 or .js hook. This shim needs no Python
    # to drain the keys, and it runs the Python guard, which the image's python3
    # interprets. Its paths are literals, which a test keeps equal to the job
    # mount and the guard's file name.
    - name: Install the job-started hook
      ansible.builtin.copy:
        src: job-guard.sh
        dest: "{{ deploy_runner_job_dir }}/{{ actions_runner_pool_job_started_hook }}"
        mode: "0755"

    - name: Install the job guard
      ansible.builtin.copy:
        src: deploy-runner-job-guard
        dest: "{{ deploy_runner_job_dir }}/{{ deploy_runner_guard_file }}"
        mode: "0644"

    - name: Write the job guard settings
      ansible.builtin.copy:
        content: "{{ deploy_runner_guard_settings | to_nice_json }}\n"
        dest: "{{ deploy_runner_job_dir }}/guard.json"
        mode: "0644"
      vars:
        deploy_runner_guard_settings:
          repository: "{{ deploy_runner_guard_repository }}"
          ref: "{{ deploy_runner_guard_ref }}"
          events: "{{ deploy_runner_guard_events }}"
          url: "{{ deploy_runner_guard_url }}"
          known_hosts: "{{ deploy_runner_job_mount }}/known_hosts"
          cache: "{{ deploy_runner_guard_cache }}"

    - name: Write the job guard's known hosts
      ansible.builtin.copy:
        content: "{{ deploy_runner_guard_host_key }}\n"
        dest: "{{ deploy_runner_job_dir }}/known_hosts"
        mode: "0644"

    # ssh-keygen writes each private key with mode 0600, and they stay that way
    # in a 0700 directory that no container mounts. The slot script's tar stream
    # reads them as the service user, at each job's start.
    - name: Generate the keys
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "{{ inventory_hostname }}{{ item.comment }}"
          - -f
          - "{{ deploy_runner_secrets_dir }}/{{ item.file }}"
        creates: "{{ deploy_runner_secrets_dir }}/{{ item.file }}"
      loop:
        - {file: "{{ deploy_runner_ssh_key_file }}", comment: ""}
        - {file: "{{ deploy_runner_repo_key_file }}", comment: -repo-read}
      loop_control:
        label: "{{ item.file }}"
      when: not ansible_check_mode

    - name: Read the public keys
      ansible.builtin.slurp:
        src: "{{ deploy_runner_secrets_dir }}/{{ item }}.pub"
      loop: ["{{ deploy_runner_ssh_key_file }}", "{{ deploy_runner_repo_key_file }}"]
      register: deploy_runner_public_keys
      when: not ansible_check_mode

    - name: Print the public keys
      ansible.builtin.debug:
        msg: >-
          {{ 'Authorize on each deploy target' if item.item == deploy_runner_ssh_key_file
          else 'Add as a read-only deploy key on ' ~ deploy_runner_guard_repository }}:
          {{ item.content | b64decode | trim }}
      loop: "{{ deploy_runner_public_keys.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not ansible_check_mode
