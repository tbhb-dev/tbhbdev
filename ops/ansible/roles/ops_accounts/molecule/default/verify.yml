---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Validate the sudoers drop-in
      ansible.builtin.command:
        cmd: visudo -cf /etc/sudoers.d/ops
      changed_when: false

    - name: Look up ops-ro
      ansible.builtin.getent:
        database: passwd
        key: ops-ro
        fail_key: false

    - name: Look for the ops-ro home
      ansible.builtin.stat:
        path: /home/ops-ro
      register: ops_accounts_ro_home

    - name: Read the sudo rights of ops
      ansible.builtin.command:
        cmd: sudo -l -U ops
      register: ops_accounts_sudo
      changed_when: false

    - name: Read the password state of ops
      ansible.builtin.command:
        cmd: passwd -S ops
      register: ops_accounts_passwd
      changed_when: false

    - name: Read the ops authorized keys
      ansible.builtin.slurp:
        src: /home/ops/.ssh/authorized_keys
      register: ops_accounts_keys

    - name: Look up ops
      ansible.builtin.getent:
        database: passwd
        key: ops
      register: ops_accounts_passwd_ops

    - name: Look up the ops group
      ansible.builtin.getent:
        database: group
        key: ops
      register: ops_accounts_group_ops

    - name: Check the accounts
      ansible.builtin.assert:
        that:
          - ops_accounts_passwd_ops.ansible_facts.getent_passwd.ops[1:3] == ['24369', '24369']
          - ops_accounts_group_ops.ansible_facts.getent_group.ops[1] == '24369'
          - "'ops-ro' not in ansible_facts.getent_passwd"
          - not ops_accounts_ro_home.stat.exists
          - "'(ALL : ALL) NOPASSWD: ALL' in ops_accounts_sudo.stdout"
          - ops_accounts_passwd.stdout.split()[1] == 'L'
          - "'molecule-admin' in ops_accounts_keys.content | b64decode"
