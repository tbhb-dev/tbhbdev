---
argument_specs:
  main:
    short_description: Create the ops remote account and remove ops-ro
    options:
      ops_accounts_admin_keys_exclusive:
        type: bool
        default: true
        description: >-
          Whether the key task removes every authorized key that ops_accounts_admin_keys doesn't list.
          False only adds the listed keys and leaves the others.
      ops_accounts_admin_keys:
        type: list
        elements: str
        required: true
        description: Public keys authorized for ops, which has full sudo.
