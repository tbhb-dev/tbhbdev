---
argument_specs:
  main:
    short_description: Prepare a host for tbhbdev host bootstrap's agent account
    description:
      - >-
          Installs the ACL tools that tbhbdev host bootstrap uses, and gives the agent's home and
          /tmp their own logical volumes, mounted nodev and nosuid, and nofail so a missing volume
          never stops the boot. The home's root takes the agent's uid and gid before the account
          exists, so bootstrap finds the home it would make.
      - >-
          On macOS the role installs nothing. APFS has no logical volumes, so a macOS host sets
          both sizes empty and agent_host_home to /Users/example-user, where bootstrap puts the home.
      - >-
          The /tmp volume takes over from the stock tmpfs at the next boot. Until then the role only
          writes its fstab entry.
      - >-
          Linux installs bubblewrap for tbhbdev's agent sandbox, loads its AppArmor user namespace
          allowance when the kernel restricts namespaces, and probes it as an existing agent account.
    options:
      agent_host_load_apparmor:
        type: bool
        default: true
        description: Load the bubblewrap profile. Disable only in containers that cannot manage AppArmor.
      agent_host_verify_bwrap:
        type: bool
        default: true
        description: >-
          Probe bubblewrap as agent outside check mode, after account creation if needed.
          Disable in containers without user namespaces.
      agent_host_uid:
        type: int
        default: 24368
        description: The agent user's uid, which tbhbdev host bootstrap assigns.
      agent_host_gid:
        type: int
        default: 33835
        description: The devel group's gid, which tbhbdev host bootstrap assigns.
      agent_host_home:
        type: path
        default: /home/example-user
        description: >-
          The agent's home, where tbhbdev host bootstrap puts it. Linux's is the default; macOS's is
          /Users/example-user.
      agent_host_vg:
        type: str
        default: ubuntu-vg
        description: Volume group that holds both logical volumes.
      agent_host_home_size:
        type: str
        default: 500G
        description: Size of the agent-home logical volume. Empty leaves the home on the root file system.
      agent_host_tmp_size:
        type: str
        default: 64G
        description: Size of the tmp logical volume. Empty leaves /tmp as it is.
