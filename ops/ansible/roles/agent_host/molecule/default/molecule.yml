---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: agent-host-ubuntu-2604-${MOLECULE_RUN_ID:-local}
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
    command: sleep infinity
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
  inventory:
    group_vars:
      all:
        agent_host_home_size: ""
        agent_host_tmp_size: ""
        # The container shares its host's kernel and cannot load policy.
        agent_host_load_apparmor: false
        agent_host_verify_bwrap: false
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
