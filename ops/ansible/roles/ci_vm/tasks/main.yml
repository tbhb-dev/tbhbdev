---
# Root writes the egress table, builds the cloud-init seed, and creates the
# VM's volume and domain. A new VM's seed carries a tailnet key that the
# controller mints first. The table and the seed need no hardware. The
# volume, the image and the domain do, and ci_vm_hardware false skips them.
# A check run stops each step that needs an earlier step's package or
# directory, since that step only reports a change.

- name: Check the settings
  ansible.builtin.assert:
    that:
      - ci_vm_name is match('^[a-z][a-z0-9-]*$')
      - ci_vm_vg is match('^[A-Za-z0-9+_.][A-Za-z0-9+_.-]*$')
      - ci_vm_disk_size | human_to_bytes > 0
      - ci_vm_vcpus | int > 0
      - ci_vm_memory_mib | int > 0
      - ci_vm_image_sha256 is match('^[0-9a-f]{64}$')
      - ci_vm_network_bridge is match('^[A-Za-z0-9_.-]+$')
      - ci_vm_network_bridge != 'br-lab'
      - ci_vm_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - ci_vm_address.split('.') | map('int') | max < 256
      # The ci group's ansible_host is a literal, because group vars don't see role defaults.
      - ci_vm_name not in hostvars or hostvars[ci_vm_name].ansible_host | default(ci_vm_address) == ci_vm_address
      - ci_vm_network_gateway is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - ci_vm_network_gateway.split('.') | map('int') | max < 256
      - ci_vm_network_gateway.split('.')[:3] == ci_vm_address.split('.')[:3]
      - ci_vm_network_gateway != ci_vm_address
      - ci_vm_name not in hostvars or hostvars[ci_vm_name].ci_vm_network_gateway == ci_vm_network_gateway
      - ci_vm_admin_keys | length > 0
      - ci_vm_egress_blocked_v4 | length > 0
      - ci_vm_egress_blocked_v6 | length > 0
    fail_msg: >-
      ci_vm_name must be a lowercase host name, ci_vm_vg a valid LVM name, ci_vm_disk_size a size, the
      CPU and memory counts positive, ci_vm_image_sha256 a sha256, ci_vm_network_bridge a bridge other
      than br-lab, ci_vm_address an IPv4 address equal to the VM's ansible_host, ci_vm_network_gateway
      a different IPv4 address in the same /24 matching the VM inventory's gateway when present, and
      the admin keys and both blocked lists non-empty
    quiet: true

- name: Install the tools the volume, the seed and the table need
  ansible.builtin.apt:
    name:
      - cloud-image-utils
      - lvm2
      - nftables
    state: present
    install_recommends: false
    # Do not let package installation start the stock flushing service.
    policy_rc_d: 101
  register: ci_vm_packages

- name: Load the egress table
  ansible.builtin.include_tasks: egress.yml
  when: not (ansible_check_mode and ci_vm_packages is changed)

# Read before the seed, since a key is minted only for a domain that doesn't
# exist yet, and vm.yml defines the domain on the same fact.
- name: Read the domain
  ansible.builtin.command:
    argv: [virsh, --connect=qemu:///system, dominfo, "{{ ci_vm_name }}"]
  register: ci_vm_dom
  changed_when: false
  failed_when: false
  check_mode: false
  when: ci_vm_hardware

# cloud-init reads the seed at the first boot only, so an existing domain
# needs no key. Test containers and check runs mint none either.
- name: Mint the VM's tailnet key
  ansible.builtin.include_tasks: join.yml
  when:
    - ci_vm_hardware
    - ci_vm_dom.rc != 0
    - not ansible_check_mode

- name: Build the cloud-init seed
  ansible.builtin.include_tasks: seed.yml
  when: not (ansible_check_mode and ci_vm_packages is changed)

- name: Create the volume and the domain
  ansible.builtin.include_tasks: vm.yml
  when:
    - ci_vm_hardware
    - not (ansible_check_mode and ci_vm_packages is changed)
