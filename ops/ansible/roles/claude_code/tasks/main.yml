---
# Runs as the agent account, so nothing under its home ends up root-owned.
# The role never reads or writes credentials or runs a login.
- name: Check the account name
  ansible.builtin.assert:
    that:
      - claude_code_account not in ['root', 'tony']
      - claude_code_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - claude_code_platform in claude_code_sha256
      - claude_code_sha256[claude_code_platform] is match('^[a-f0-9]{64}$')
    fail_msg: >-
      claude_code_account must be the agent account, never root or tony, and the version a plain x.y.z;
      the host must be Apple silicon macOS or Linux on x86_64 or aarch64
    quiet: true

# getent is missing on macOS, and Python 3 is on every agent host.
- name: Find the account's home
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import pwd,sys; print(pwd.getpwnam(sys.argv[1]).pw_dir)
      - "{{ claude_code_account }}"
  register: claude_code_passwd
  changed_when: false
  check_mode: false
  failed_when: false

# agent_account creates the account earlier in the same play on a first run,
# so a missing account here means a host that skipped it.
- name: Note a missing account
  ansible.builtin.debug:
    msg: "{{ claude_code_account }} doesn't exist yet, so Claude Code waits for the next run"
  when: claude_code_passwd.rc != 0

- name: Install beside the other versions
  when: claude_code_passwd.rc == 0
  become: true
  become_user: "{{ claude_code_account }}"
  block:
    - name: Check the home
      ansible.builtin.assert:
        that: claude_code_home is match('^/[^ ]+$') and claude_code_home is not match('.*/(root|tony)$')
        fail_msg: "{{ claude_code_home }} is not a home this role installs into"
        quiet: true

    - name: Create the version directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ claude_code_home }}/.local"
        - "{{ claude_code_home }}/.local/share"
        - "{{ claude_code_home }}/.local/share/claude"
        - "{{ claude_code_dir }}"
      register: claude_code_version_dir

    # get_url verifies the pinned hash before publishing an executable file.
    - name: Download the release binary
      ansible.builtin.get_url:
        url: >-
          https://downloads.claude.ai/claude-code-releases/{{ claude_code_version }}/{{
          claude_code_platform }}/claude
        dest: "{{ claude_code_binary }}"
        checksum: sha256:{{ claude_code_sha256[claude_code_platform] }}
        mode: "0755"
      when: not (ansible_check_mode and claude_code_version_dir is changed)

    - name: Check the version
      ansible.builtin.command:
        argv: ["{{ claude_code_binary }}", "--version"]
      register: claude_code_reported
      changed_when: false
      when: not ansible_check_mode

    - name: Require the pinned version
      ansible.builtin.assert:
        that: claude_code_reported.stdout == claude_code_version ~ ' (Claude Code)'
        fail_msg: >-
          {{ claude_code_binary }} reports {{ claude_code_reported.stdout }},
          not {{ claude_code_version }}
        quiet: true
      when: not ansible_check_mode

    # The switch is its own step. Pointing the link back at an older version
    # rolls it back.
    - name: Create the link directory
      ansible.builtin.file:
        path: "{{ claude_code_home }}/.local/bin"
        state: directory
        mode: "0755"
      when: claude_code_activate | bool

    - name: Point the active link at this version
      ansible.builtin.file:
        src: "{{ claude_code_binary }}"
        dest: "{{ claude_code_home }}/.local/bin/claude"
        state: link
        # In check mode the predicted binary does not exist yet.
        force: "{{ ansible_check_mode }}"
      when: claude_code_activate | bool
