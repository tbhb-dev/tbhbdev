---
# Codex, installed beside any other version for the agent account only.
# Each version unpacks into <home>/.local/share/codex/<version>/. The role
# switches the active <home>/.local/bin/codex link only when
# codex_cli_activate is true. Never delete an old version here; point
# the link back at it to roll back.
codex_cli_account: agent
codex_cli_version: 0.166.0
codex_cli_activate: false
# The release is openai/codex rust-v<version>. Each key is a release asset's
# platform: codex-<key>.tar.gz holds one executable, codex-<key>. The digests
# are the ones GitHub publishes for the assets in the release API, which
# the release's codex-package_SHA256SUMS does not cover for these plain
# archives. Trust on first download: on 2026-11-10 in UTC, all three archives
# were fetched from the release URLs and hashed, and each hash matches the
# published digest.
codex_cli_sha256:
  aarch64-apple-darwin: c48824462fc57681eafb0925d97b11b589010475613904f570b42fea53e240d5
  x86_64-unknown-linux-musl: a0bf572d2f93f056c6712a6da348e96078dc84f3885fd7be67807ef389cb3978
  aarch64-unknown-linux-musl: 94eb707605ec2646b2e05b7edf7c4e7b3ccf02b16237c34ae9beb8cfb7f810a9
codex_cli_platform: >-
  {{ 'aarch64-apple-darwin'
  if ansible_facts['system'] == 'Darwin' and ansible_facts['architecture'] in ['arm64', 'aarch64']
  else 'x86_64-unknown-linux-musl' if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'x86_64'
  else 'aarch64-unknown-linux-musl' if ansible_facts['system'] == 'Linux' and ansible_facts['architecture'] == 'aarch64'
  else 'unsupported' }}
# The account's home, which the role reads from the host's account database.
codex_cli_home: "{{ codex_cli_passwd.stdout | trim }}"
codex_cli_dir: "{{ codex_cli_home }}/.local/share/codex/{{ codex_cli_version }}"
codex_cli_binary: "{{ codex_cli_dir }}/codex-{{ codex_cli_platform }}"
