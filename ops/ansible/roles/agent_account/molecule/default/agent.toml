# A regression fixture copied from the inventory values, not evidence of live hosts.
[agent]
launch_wait_seconds = 120
kill_grace_seconds = 10
agy_timeout = "900s"
max_run_minutes = 45
sockets_dir = ".local/state/tbhbdev/sockets"

[agent.sandbox]
host_path = ["/home/example-user/.local/share/example-tools/bazelisk-1.30.0/bin", "/home/example-user/.local/share/codex-standalone/releases/0.166.0-x86_64-unknown-linux-musl/bin", "/home/example-user/.local/share/uv/tools/prek/bin"]
audit_dir = "agent-audit"

[agent.sandbox.path]
linux = ["/usr/bin", "/bin", "/usr/local/bin"]
macos = ["/usr/bin", "/bin", "/usr/local/bin"]

[agent.codex]
web_search = { build = "disabled", review = "disabled" }

[agent.credentials.agent]
signing = "/home/example-user/.config/devtools/agent-signing-key"
reviews_app_client_id = "host-0-shared/review-app/client_id"
reviews_app_pem = "host-0-shared/review-app/private_key"
pull_requests_app_client_id = "host-0-shared/github-app-tbhb-dev-agent-pull-requests/client_id"
pull_requests_app_pem = "host-0-shared/github-app-tbhb-dev-agent-pull-requests/private_key"

[agent.claude]
default_profile = "primary"

[[agent.host]]
name = "host-a"
os = "linux"
shell = "bash"
account = "agent"
accounts = ["agent"]

[[agent.host]]
name = "host-b"
os = "linux"
shell = "bash"
account = "agent"
accounts = ["agent"]

