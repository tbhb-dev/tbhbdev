---
- name: chezmoi | Map the architecture
  ansible.builtin.assert:
    that: ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: agent_account installs chezmoi on x86_64 and aarch64 only
    quiet: true

# The checksum pins the tarball, so a changed asset fails the download.
- name: chezmoi | Download the release tarball
  ansible.builtin.get_url:
    url: >-
      https://github.com/twpayne/chezmoi/releases/download/v{{ agent_account_chezmoi_version }}/chezmoi_{{
      agent_account_chezmoi_version }}_linux_{{ agent_account_chezmoi_arch }}.tar.gz
    dest: /usr/local/src/chezmoi_{{ agent_account_chezmoi_version }}_linux_{{ agent_account_chezmoi_arch }}.tar.gz
    checksum: sha256:{{ agent_account_chezmoi_sha256[agent_account_chezmoi_arch] }}
    owner: root
    group: root
    mode: '0644'
  register: agent_account_chezmoi_archive

# A check run can't unpack a tarball it would only download.
- name: chezmoi | Install the binary
  ansible.builtin.unarchive:
    src: /usr/local/src/chezmoi_{{ agent_account_chezmoi_version }}_linux_{{ agent_account_chezmoi_arch }}.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [chezmoi]
    owner: root
    group: root
    mode: '0755'
  when: not (ansible_check_mode and agent_account_chezmoi_archive is changed)
