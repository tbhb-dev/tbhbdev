---
# cspell:ignore endmacro
- name: config-values | Require typed TOML values recursively
  vars:
    agent_account_config_invalid: >-
      {%- macro invalid(value, path='') -%}
      {%- if agent_account_config_table.key == 'agent' and path == '.host' -%}
      {%- if value is not sequence or value is string or value is mapping -%}invalid
      {%- else -%}
      {%- for row in value -%}
      {%- if row is not mapping or row | list | sort !=
          ['account', 'accounts', 'name', 'os', 'shell'] -%}invalid
      {%- elif row.name is not string or row.os is not string or row.shell is not string or
          row.account is not string or row.accounts is not sequence or
          row.accounts is string or row.accounts is mapping -%}invalid
      {%- elif row.accounts | select('string') | list != row.accounts -%}invalid
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endif -%}
      {%- if agent_account_config_table.key == 'agent' and path == '.claude' and
          value is mapping and 'profiles' in value -%}invalid{%- endif -%}
      {%- if value is string and value is search('[\x7f\U00010000-\U0010ffff]') -%}invalid{%- endif -%}
      {%- if value is mapping -%}
      {%- for key, item in value.items() -%}
      {%- if key is not string or key is not match('^[A-Za-z0-9_-]+\\Z') -%}invalid{%- endif -%}
      {{- invalid(item, path ~ '.' ~ key) -}}
      {%- endfor -%}
      {%- elif value is sequence and value is not string -%}
      {%- if agent_account_config_table.key == 'agent' and
          (path == '.codex.web_search' or path.startswith('.codex.web_search.')) and
          value | select('mapping') | list | length > 0 -%}invalid{%- endif -%}
      {%- if value | select('mapping') | list | length not in [0, value | length] -%}invalid{%- endif -%}
      {%- for item in value -%}
      {%- if item is sequence and item is not string and item is not mapping -%}invalid{%- endif -%}
      {{- invalid(item, path ~ '[]') -}}
      {%- endfor -%}
      {%- elif value is not string and value is not integer and value is not boolean -%}invalid
      {%- endif -%}
      {%- endmacro -%}
      valid{{- invalid(agent_account_config_table.value) -}}
  ansible.builtin.assert:
    that:
      - agent_account_config_table.key is string
      - agent_account_config_table.key is match('^[A-Za-z0-9_-]+\\Z')
      - agent_account_config_table.value is mapping
      - agent_account_config_invalid == 'valid'
    fail_msg: >-
      Agent TOML requires typed values and exact host row keys
    quiet: true
