---
- name: password-macos | Read the password marker
  ansible.builtin.command:
    argv: [dscl, '.', -read, /Users/example-user, Password]
  register: agent_account_macos_password
  check_mode: false
  changed_when: false
  no_log: true

# DarwinUser maps an empty password to dscl -create /Users/example-user Password '*',
# exactly as bootstrap does, instead of setting a cleartext password.
- name: password-macos | Set the locked password marker
  ansible.builtin.user:
    name: agent
    password: ""
  when: >-
    agent_account_macos_password.stdout | trim != 'Password: *'
