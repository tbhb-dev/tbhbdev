---
- name: Check the Linux account and pins
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture in ['x86_64', 'aarch64']
      - tbhbops_tool_commit is match('^[0-9a-f]{40}$')
      - tbhbops_tool_user != 'tony'
      - tbhbops_tool_user is match('^[a-z_][a-z0-9_-]*[$]?$')
      - tbhbops_tool_uv_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - tbhbops_tool_uv_sha256.x86_64 is match('^[0-9a-f]{64}$')
      - tbhbops_tool_uv_sha256.aarch64 is match('^[0-9a-f]{64}$')
    fail_msg: Check the account and pins. Ansible never manages the operator's own account.
    quiet: true

- name: Read the tool account
  ansible.builtin.getent:
    database: passwd
    key: "{{ tbhbops_tool_user }}"

- name: Set the account paths
  ansible.builtin.set_fact:
    tbhbops_tool_home: "{{ ansible_facts.getent_passwd[tbhbops_tool_user][4] }}"

- name: Set the install paths
  ansible.builtin.set_fact:
    tbhbops_tool_bin: "{{ tbhbops_tool_home }}/.local/bin"
    tbhbops_tool_state: "{{ tbhbops_tool_home }}/.local/share/tbhbops-tool"
    tbhbops_tool_environment: "{{ tbhbops_tool_home }}/.local/share/tbhbops-tool/venv"
    tbhbops_tool_cache: "{{ tbhbops_tool_home }}/.cache/tbhbops-tool/{{ tbhbops_tool_commit }}"

- name: Read the installed state as the tool account
  become: true
  become_user: "{{ tbhbops_tool_user }}"
  environment:
    HOME: "{{ tbhbops_tool_home }}"
  block:
    - name: Look for the commit record
      ansible.builtin.stat:
        path: "{{ tbhbops_tool_state }}/marker"
      register: tbhbops_tool_marker_stat

    - name: Read the commit record
      ansible.builtin.slurp:
        src: "{{ tbhbops_tool_state }}/marker"
      when: tbhbops_tool_marker_stat.stat.exists
      register: tbhbops_tool_marker

    - name: Check the installed command and o11y group
      ansible.builtin.command:
        argv: "{{ [tbhbops_tool_bin + '/tbhbops'] + item }}"
      loop:
        - [--help]
        - [o11y, --help]
      register: tbhbops_tool_health
      changed_when: false
      failed_when: false
      check_mode: false

- name: Prepare the pinned source and install when needed
  block:
    # Final requirements include wheel hashes and host paths. Build even in
    # check mode to compare the exact expected digest without host writes.
    # Include on every host; run_once on the included tasks shares their
    # registered results with the whole batch.
    - name: Read the pinned requirements on the controller
      ansible.builtin.include_tasks: source.yml

    - name: Build and hash the wheels on the controller
      ansible.builtin.include_tasks: build.yml

    - name: Assemble the final requirements for this account
      ansible.builtin.set_fact:
        tbhbops_tool_requirements: |
          {{ lookup('ansible.builtin.file', tbhbops_tool_source.path + '/dist/requirements.txt') | trim }}
          tbhbops @ file://{{ tbhbops_tool_cache }}/{{
            tbhbops_tool_library_wheels.files[0].path | basename }} --hash=sha256:{{
            tbhbops_tool_wheel_digests.results[0].stat.checksum }}
          tbhbops-cli @ file://{{ tbhbops_tool_cache }}/{{
            tbhbops_tool_cli_wheels.files[0].path | basename }} --hash=sha256:{{
            tbhbops_tool_wheel_digests.results[1].stat.checksum }}

    - name: Assemble the expected marker
      ansible.builtin.set_fact:
        tbhbops_tool_expected_marker: |
          commit={{ tbhbops_tool_commit }}
          requirements_sha256={{ tbhbops_tool_requirements | hash('sha256') }}

    - name: Compare the commit and final requirements with the record
      ansible.builtin.set_fact:
        tbhbops_tool_marker_differs: >-
          {{ (tbhbops_tool_marker.content | default('') | b64decode) != tbhbops_tool_expected_marker }}

    - name: Decide whether the account needs an install
      ansible.builtin.set_fact:
        tbhbops_tool_needs_install: >-
          {{ tbhbops_tool_marker_differs or
              tbhbops_tool_health.results | selectattr('rc', 'ne', 0) | list | length > 0 }}

    - name: Read the installed uv version when an install is pending
      ansible.builtin.command:
        argv: ["{{ tbhbops_tool_bin }}/uv", --version]
      become: true
      become_user: "{{ tbhbops_tool_user }}"
      register: tbhbops_tool_uv
      changed_when: false
      failed_when: false
      check_mode: false
      when: tbhbops_tool_needs_install

    - name: Report a pending install in check mode
      ansible.builtin.debug:
        msg: Would build, copy and install tbhbops at {{ tbhbops_tool_commit }}
      when:
        - ansible_check_mode
        - tbhbops_tool_needs_install
      changed_when: true

    - name: Install the tool as its account
      ansible.builtin.include_tasks: install.yml
      when:
        - not ansible_check_mode
        - tbhbops_tool_needs_install
  always:
    - name: Remove the controller scratch directory
      ansible.builtin.file:
        path: "{{ tbhbops_tool_source.path }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      check_mode: false
      changed_when: false
      when: tbhbops_tool_source.path is defined
