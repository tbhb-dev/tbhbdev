---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: tbhbops-tool-ubuntu-2404-${MOLECULE_RUN_ID:-local}
    image: tbhbops-tool-ubuntu:24.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: sleep infinity
  - name: tbhbops-tool-ubuntu-2404-second-${MOLECULE_RUN_ID:-local}
    image: tbhbops-tool-ubuntu:24.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: sleep infinity
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
