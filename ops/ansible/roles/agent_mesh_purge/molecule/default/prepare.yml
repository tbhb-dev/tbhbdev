---
- name: Prepare accounts
  hosts: all
  become: true
  tasks:
    - name: Create the accounts
      ansible.builtin.user:
        name: "{{ item }}"
        create_home: true
      loop: [agent, ops]

    - name: Create the ssh directories
      ansible.builtin.file:
        path: "/home/{{ item }}/.ssh/agent-mesh"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0700"
      loop: [agent, ops]

    - name: Place the mesh files and the files to keep
      ansible.builtin.copy:
        dest: "/home/{{ item.0 }}/.ssh/{{ item.1.name }}"
        content: "{{ item.1.content }}"
        owner: "{{ item.0 }}"
        group: "{{ item.0 }}"
        mode: "0600"
      loop: "{{ ['agent', 'ops'] | product(files) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1.name }}"
      no_log: true
      vars:
        files:
          - {name: agent-mesh/agent_ed25519, content: "fixture mesh private\n"}
          - {name: agent-mesh.conf, content: "Host peer-a\n  IdentityFile ~/.ssh/agent-mesh/agent_ed25519\n"}
          - {name: "agent-mesh.conf.1234.2026-11-09@00:00:00~", content: "backup\n"}
          - {name: agent-mesh_known_hosts, content: "peer-a ssh-ed25519 AAAAfixture\n"}
          - {name: id_ed25519, content: "fixture private\n"}
          - {name: known_hosts_tbhb, content: "peer-a ssh-ed25519 AAAAfixture\n"}
          - name: config
            content: |
              Include ~/.ssh/agent-mesh.conf
                Include ~/.ssh/agent-mesh/extra.conf
              Include ~/.ssh/other.conf
              # BEGIN ANSIBLE MANAGED BLOCK ssh_host_keys
              Host peer-a
                IdentityFile ~/.ssh/id_ed25519
              # END ANSIBLE MANAGED BLOCK ssh_host_keys
