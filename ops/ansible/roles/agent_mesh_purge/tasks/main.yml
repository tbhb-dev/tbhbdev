---
- name: Require Linux or macOS
  ansible.builtin.assert:
    that:
      - ansible_facts.system in ['Linux', 'Darwin']
      - agent_mesh_purge_users | length > 0
    quiet: true

# id works on Linux and macOS alike, where getent is Linux only.
- name: Look up each account
  ansible.builtin.command:
    argv: [id, -u, "{{ item }}"]
  loop: "{{ agent_mesh_purge_users }}"
  register: agent_mesh_purge_ids
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say when an account is missing
  ansible.builtin.debug:
    msg: "{{ item.item }} does not exist on {{ inventory_hostname }}, so nothing is purged for it."
  loop: "{{ agent_mesh_purge_ids.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Keep the accounts that exist
  ansible.builtin.set_fact:
    agent_mesh_purge_existing: >-
      {{ agent_mesh_purge_ids.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}

# Every proof runs before any removal, so one failed login leaves every account untouched.
- name: Prove the per-host keys
  ansible.builtin.include_tasks: proof.yml
  loop: "{{ agent_mesh_purge_existing }}"
  loop_control:
    loop_var: agent_mesh_purge_user
  when: agent_mesh_purge_require_proof

- name: Purge each account
  ansible.builtin.include_tasks: user.yml
  loop: "{{ agent_mesh_purge_existing }}"
  loop_control:
    loop_var: agent_mesh_purge_user
