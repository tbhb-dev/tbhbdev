---
# Runs as the account. None of it reads or changes id_ed25519, known_hosts_tbhb or the
# ssh_host_keys block in the config.
- name: user | Remove the agent mesh files as the account
  become: true
  become_user: "{{ agent_mesh_purge_user }}"
  block:
    - name: user | Remove the mesh directory and files
      ansible.builtin.file:
        path: "{{ agent_mesh_purge_directory }}/{{ item }}"
        state: absent
      loop:
        - agent-mesh
        - agent-mesh.conf
        - agent-mesh_known_hosts

    - name: user | Find the backups of the mesh config
      ansible.builtin.find:
        paths: "{{ agent_mesh_purge_directory }}"
        patterns: ["agent-mesh.conf.*~"]
        file_type: file
      register: agent_mesh_purge_backups

    - name: user | Remove the backups of the mesh config
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ agent_mesh_purge_backups.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: user | Remove the Include lines for the mesh config
      ansible.builtin.lineinfile:  # cspell:disable-line:
        path: "{{ agent_mesh_purge_config }}"
        regexp: '^\s*Include\s+.*agent-mesh'
        state: absent
