---
# Runs as the account. stat reads metadata only, and ssh is the only thing that opens the key.
- name: proof | Look for the per-host key
  become: true
  become_user: "{{ agent_mesh_purge_user }}"
  ansible.builtin.stat:
    path: "{{ agent_mesh_purge_private_key }}"
  register: agent_mesh_purge_key_stat

- name: proof | Require the per-host key
  ansible.builtin.assert:
    that: agent_mesh_purge_key_stat.stat.exists
    fail_msg: >-
      {{ agent_mesh_purge_user }} on {{ inventory_hostname }} has no ~/.ssh/id_ed25519, so its
      keys are unproven and nothing is removed.
    quiet: true

# A host with no key, such as a NAS, isn't an agent host and has nothing to prove.
- name: proof | Log in to each other agent host
  become: true
  become_user: "{{ agent_mesh_purge_user }}"
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - /dev/null
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - -o
      - IdentityAgent=none
      - -o
      - ConnectTimeout=10
      - -i
      - ~/.ssh/id_ed25519
      - -o
      - UserKnownHostsFile=~/.ssh/known_hosts_tbhb
      - "{{ agent_mesh_purge_user }}@{{ item }}"
      - "true"
  loop: "{{ agent_mesh_purge_peers }}"
  register: agent_mesh_purge_proof
  changed_when: false
  failed_when: false
  check_mode: false

- name: proof | Require every login to pass
  ansible.builtin.assert:
    that: >-
      agent_mesh_purge_proof.results | default([]) | rejectattr('skipped', 'defined')
      | map(attribute='rc') | select('ne', 0) | list | length == 0
    fail_msg: >-
      {{ agent_mesh_purge_user }} on {{ inventory_hostname }} could not log in to another agent
      host with its own key, so nothing is removed.
    quiet: true
