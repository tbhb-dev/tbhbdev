---
# synouser takes the password as an argument, so it shows in the NAS's process
# list for the moment the command runs. The task always reports changed,
# because synouser doesn't say whether the password differed.
- name: set_password | Set the DSM password of ops
  ansible.builtin.command:
    argv:
      - synouser
      - --setpw
      - ops
      - >-
          {{ lookup('ansible.builtin.pipe',
          dsm_accounts_lookup_command ~ ' ' ~ (dsm_accounts_password_ref | quote | quote)) }}
  become: true
  changed_when: true
  no_log: true
