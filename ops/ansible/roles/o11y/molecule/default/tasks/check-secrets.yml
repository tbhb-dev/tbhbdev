---
- name: check-secrets | Check registered vars and the captured output including diffs
  ansible.builtin.assert:
    that:
      - "'molecule-discord-canary-42' not in (hostvars[inventory_hostname] | to_json)"
      - "'molecule-smtp-canary-84' not in (hostvars[inventory_hostname] | to_json)"
      - >-
          'molecule-discord-canary-42' not in lookup('file',
          lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') + '/converge.log')
      - >-
          'molecule-smtp-canary-84' not in lookup('file',
          lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') + '/converge.log')
      - "'MoleculeAgentsCanary42' not in (hostvars[inventory_hostname] | to_json)"
      - >-
          'MoleculeAgentsCanary42' not in lookup('file',
          lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') + '/converge.log')
    quiet: true
  no_log: true
  diff: false
