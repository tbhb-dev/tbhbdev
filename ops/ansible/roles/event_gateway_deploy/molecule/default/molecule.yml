---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: event-gateway-${MOLECULE_RUN_ID:-local}
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
