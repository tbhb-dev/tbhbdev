---
- name: gitleaks | Install private gitleaks files for this account
  become: true
  become_user: "{{ agent_workspace_user }}"
  block:
    - name: gitleaks | Create the private gitleaks directory
      ansible.builtin.file:
        path: "{{ [agent_workspace_config_home, '.config', 'gitleaks'] | join('/') }}"
        state: directory
        mode: '0700'

    - name: gitleaks | Write the validated private gitleaks config atomically
      ansible.builtin.copy:
        dest: "{{ [agent_workspace_config_home, '.config', 'gitleaks'] | join('/') }}/private.toml"
        content: "{{ agent_workspace_private_config }}\n"
        mode: '0600'
      no_log: true
      diff: false
