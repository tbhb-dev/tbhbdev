---
# The same role, run as ops on a host with no agent account and no Code
# directory. Only the account changes: no root, group or path variable is set.
- name: Converge
  hosts: all
  vars:
    agent_workspace_reviews_ref: "{{ 'op://' ~ 'test-vault/review-app' }}"
    agent_workspace_gitleaks_ref: "{{ 'op://' ~ 'test-vault/scanner/config' }}"
    agent_workspace_connect_endpoints: [https://op-connect.example.example.invalid]
    agent_workspace_user: ops
    agent_workspace_repos:
      - name: fixture/repo
    agent_workspace_tools: /home/ops/Code/github.com/fixture/repo
    agent_workspace_connect_vaults: [host-0-shared, host-fixture]
    agent_workspace_lookup_command: "bash {{ playbook_dir }}/../default/files/read.sh"
  tasks:
    - name: Maintain the workspace as ops
      ansible.builtin.include_role:
        name: agent_workspace
