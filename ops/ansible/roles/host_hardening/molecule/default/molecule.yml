---
# Privileged so nft -c can open a netlink socket and check the ruleset. The
# table is checked, never loaded: the container shares the host's kernel.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  # test-ansible sets MOLECULE_RUN_ID, so concurrent runs get distinct containers.
  - name: host-hardening-ubuntu-2604-${MOLECULE_RUN_ID:-local}
    # The runner builds this content-addressed image when its cache is missing.
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
    privileged: true
    command: /sbin/init
    cgroupns_mode: private
    tmpfs:
      - /run
      - /tmp
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
