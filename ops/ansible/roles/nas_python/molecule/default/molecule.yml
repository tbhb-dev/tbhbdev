---
# A plain Ubuntu container stands in for DSM: the role's install is POSIX sh
# plus curl, and the container's own Python is never used by the role. The
# container needs network access to GitHub, where uv and its Pythons live.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  # test-ansible sets MOLECULE_RUN_ID, so concurrent runs get distinct containers.
  - name: nas-python-ubuntu-2604-${MOLECULE_RUN_ID:-local}
    # The runner builds this content-addressed image when its cache is missing.
    image: ${MOLECULE_IMAGE}
    pre_build_image: true
prerun: false
provisioner:
  name: ansible
  connection_options:
    ansible_connection: community.docker.docker_api
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - check
    - converge
    - idempotence
    - verify
    - destroy
