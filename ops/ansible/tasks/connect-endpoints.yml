---
- name: connect-endpoints | Preserve full Connect endpoint names
  ansible.builtin.set_fact:
    connect_endpoints_resolved: "{{ connect_endpoints }}"
    cacheable: false
  no_log: true

- name: connect-endpoints | Expand short Connect endpoint names
  when: connect_endpoints | select('match', '^https://[A-Za-z0-9-]+(:[0-9]+)?$') | list | length > 0
  block:
    - name: connect-endpoints | Read Tailscale status on the target
      ansible.builtin.command:
        argv: ['{{ connect_endpoints_tailscale | default("tailscale") }}', status, --json]
      register: connect_endpoints_status
      changed_when: false
      check_mode: false
      no_log: true

    - name: connect-endpoints | Require a running Tailscale connection and a MagicDNS suffix
      ansible.builtin.assert:
        that:
          - (connect_endpoints_status.stdout | from_json).BackendState == 'Running'
          - (connect_endpoints_status.stdout | from_json).MagicDNSSuffix | default('') | trim | length > 0
        quiet: true
      no_log: true

    - name: connect-endpoints | Append the target's MagicDNS suffix to short names
      ansible.builtin.set_fact:
        connect_endpoints_resolved: >-
          {{ connect_endpoints | map('regex_replace', '^(https://[A-Za-z0-9-]+)(:[0-9]+)?$',
          '\1.' + ((connect_endpoints_status.stdout | from_json).MagicDNSSuffix | trim) + '\2') | list }}
        cacheable: false
      no_log: true
  rescue:
    - name: connect-endpoints | Explain the Connect endpoint requirement
      ansible.builtin.fail:
        msg: Connect short names require Tailscale running on the target with a nonempty MagicDNS suffix
