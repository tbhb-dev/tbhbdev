---
- name: launch-daemon | Read the daemon state
  ansible.builtin.command:
    argv: [/bin/launchctl, print, "system/{{ launch_daemon_label }}"]
  register: launch_daemon_status
  check_mode: false
  changed_when: false
  failed_when: false

- name: launch-daemon | Install the daemon
  ansible.builtin.template:
    src: "{{ launch_daemon_source }}"
    dest: "/Library/LaunchDaemons/{{ launch_daemon_label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  register: launch_daemon_plist

- name: launch-daemon | Unload the changed daemon
  ansible.builtin.command:
    argv: [/bin/launchctl, bootout, "system/{{ launch_daemon_label }}"]
  changed_when: true
  when:
    - not ansible_check_mode
    - launch_daemon_plist is changed
    - launch_daemon_status.rc == 0

- name: launch-daemon | Load the changed or unloaded daemon
  ansible.builtin.command:
    argv: [/bin/launchctl, bootstrap, system, "/Library/LaunchDaemons/{{ launch_daemon_label }}.plist"]
  changed_when: true
  when:
    - not ansible_check_mode
    - launch_daemon_plist is changed or launch_daemon_status.rc != 0
