[project]
name = "tbhbdev-workspace"
version = "0"
requires-python = ">=3.15"
dependencies = [
  "jsonschema[format]>=4.26.0",
  "referencing>=0.37.0",
  "pyyaml>=6.0.3",
  "tomlkit>=0.15.2",
]

[dependency-groups]
# The test group stands alone so a CI test matrix can sync it without the
# lint tools.
test = [
  "hypothesis>=6.170.14",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
]
dev = [
  { include-group = "test" },
  "bandit>=1.9.4",
  "complexipy>=8.3.0",
  "deptry>=0.25.1",
  "mutmut>=3.8.1",
  "pip-audit>=2.10.1",
  "prek>=0.5.9",
  "pylint>=4.1.3",
  "pyrefly>=1.4.0",
  "reuse[charset-normalizer]>=6.3.0",
  "ruff>=0.17.3",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyyaml>=6.0.12.20261030",
  "vulture>=2.16",
]

[tool.uv]
required-version = ">=0.13.0,<0.14"
exclude-newer = "5 days"
package = false

[tool.uv.workspace]
members = ["factory/cli", "ops/packages/*"]
