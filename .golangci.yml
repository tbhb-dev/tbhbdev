version: "2"

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/tbhb-dev/tbhbdev)
        - blank
        - dot
        - alias
        - localmodule
      custom-order: true
    gofumpt:
      module-path: github.com/tbhb-dev/tbhbdev
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/tbhb-dev/tbhbdev

linters:
  default: all
  disable:
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    cyclop:
      package-average: 10.0
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - mapliteral
    gocognit:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: "Use math/rand/v2 instead"
        "non-main files":
          files:
            - "!**/cmd/*/main.go"
          deny:
            - pkg: log$
              desc: "Use log/slog instead"
        # Stub for the Go CLI port (stdlib-only-front): once factory/tbhbdev
        # lands, match its front-end package files here so they may import only
        # $gostd and internal packages, never third-party vendors.
        "stdlib-only-front":
          files:
            - "**/front/**/*.go"
          allow:
            - $gostd
