# Copyright Tony Burns

version: "2"

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines

linters:
  default: all
  disable:
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    depguard:
      rules:
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: "Use math/rand/v2 instead"
        "non-main files":
          files:
            - "!**/cmd/*/main.go"
          deny:
            - pkg: log$
              desc: "Use log/slog instead"
        "stdlib-only-front":
          files:
            - "**/factory/cli/cmd/tbhbdev/*.go"
          allow:
            - $gostd
            - github.com/tbhb-dev/tbhbdev/factory/cli/internal/dispatch$
        "pure dispatch":
          list-mode: strict
          files:
            - "**/factory/cli/internal/dispatch/*.go"
            - "!$test"
          allow:
            - strings$
        "pure dispatch tests":
          list-mode: strict
          files:
            - "**/factory/cli/internal/dispatch/*_test.go"
          allow:
            - github.com/tbhb-dev/tbhbdev/factory/cli/internal/dispatch$
            - reflect$
            - testing$
