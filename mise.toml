#:schema https://mise.jdx.dev/schema/mise.json
# SPDX-License-Identifier: Apache-2.0
# Copyright Tony Burns

# Developer tools for the root workspace and its Git hooks.

[settings]
# Record resolved versions, URLs, and digests in mise.lock (committed), for
# exactly the platforms mise runs on: linux-x64, linux-arm64, macos-arm64.
# Refresh with:
#   mise lock --platform linux-x64,linux-arm64,macos-arm64
# `mise lock --platform` only adds platforms. To drop one, delete mise.lock
# first.
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
# Never write mise.lock as a side effect. `mise install` and `mise upgrade`
# read the lock and fail on a pin, or a platform, it doesn't cover.
# `mise lock` (above, or Renovate's `mise lock <tool>` after a pin bump) is
# the only writer.
locked = true
# Keep the npm tool pin in mise.lock without auxiliary lockfiles.
npm.package_manager = "npm"
# Use the explicit tool pins below.
idiomatic_version_file_enable_tools = []

[env]
# uv provisions the interpreter named by .python-version.
UV_PYTHON_PREFERENCE = "only-managed"

[tools]
bazel = "9.3.2"
bazelisk = "1.30.0"
go = "1.27.4"
python = "3.15"
uv = "0.13.8"
prek = "0.5.11"

# Match the pins in lib/rules/pins and MODULE.bazel.
actionlint = "1.7.12"
bats = "1.14.0"
buildifier = "10.1.0"
cocogitto = "7.0.0"
cue = "0.17.1"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
rumdl = "0.3.5"
"github:owenlamont/ryl" = "0.30.0"
"aqua:boyter/scc" = "4.1.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.11.3"
vale = "3.28.1"
zizmor = "1.32.0"

# Match the cspell package and Ruff's uv.lock entry.
node = "22.23.4"
cspell = "10.5.2"
ruff = "0.17.3"

[tasks.scan-secrets]
description = "Run Gitleaks with the repository policy"
run = '''
#!/usr/bin/env bash
set -euo pipefail
config_dir=$(mktemp -d)
trap 'rm -rf -- "$config_dir"' EXIT
uv run --no-project --with tomlkit==0.15.2 python \
  lib/rules/lint/private/gitleaks_config.py \
  "$PWD/lib/rules/lint/gitleaks/base.toml" .gitleaks.toml "$config_dir"
gitleaks --config "$config_dir/effective.toml" "$@"
'''
