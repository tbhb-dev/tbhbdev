# cspell:words eventfields temporaltarget

---
# Import contracts for the event-gateway Go module.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false  # deep scanning runs the go command; the test has none

components:
  cmd: {in: cmd/*}
  deploy: {in: deploy}
  eventfields: {in: internal/eventfields}
  filter: {in: internal/filter}
  routing: {in: internal/routing}
  temporaltarget: {in: internal/temporaltarget}

vendors:
  mcp:
    in: [github.com/modelcontextprotocol/go-sdk/jsonrpc, github.com/modelcontextprotocol/go-sdk/mcp]
  temporal:
    in: [go.temporal.io/api/**, go.temporal.io/sdk/**]
  websocket:
    in: [github.com/coder/websocket, github.com/coder/websocket/**]
  nats:
    in: [github.com/nats-io/nats-server/v2/**, github.com/nats-io/nats.go, github.com/nats-io/nats.go/**]
  telemetry:
    in:
      - github.com/go-logr/logr
      - github.com/go-logr/logr/funcr
      - go.opentelemetry.io/contrib/bridges/otelslog
      - go.opentelemetry.io/otel
      - go.opentelemetry.io/otel/**
      - go.opentelemetry.io/proto/otlp/**
      - google.golang.org/protobuf/proto

deps:
  deploy:
    mayDependOn: [deploy]  # no imports from the module; go-arch-lint rejects an empty list
  cmd:
    mayDependOn: [cmd, eventfields, filter, routing, temporaltarget]
    canUse: [mcp, nats, telemetry, websocket]
  eventfields:
    mayDependOn: [eventfields, filter]
  filter:
    mayDependOn: [filter]
  routing:
    mayDependOn: [routing, filter]
  temporaltarget:
    mayDependOn: [temporaltarget, eventfields, routing]
    canUse: [temporal]
