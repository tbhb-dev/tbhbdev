[rewrite."README.md"]
dest = "factory/go-vanity/README.md"
replace = [
  ["## Getting started\n\n```sh\nmise install\nbazelisk run //:bazel_env\ntbhbdev alpha install\nbazelisk test //...\n```\n\n`bazelisk test //...` runs every lint, audit, and test gate. Each push to main deploys to the `go-tbhb-dev-stg` Worker at `go-stg.tbhb.dev`, then to `go-tbhb-dev-prd` at `go.tbhb.dev`. The documentation is in [docs/](docs/index.md).\n", "## Build and test\n\nFrom the monorepo root, run:\n\n```sh\nbazelisk test --config=ci //factory/go-vanity/...\n```\n\nThe tests use the TypeScript and Cloudflare rules in `lib/rules`. The\n[end-to-end test](e2e/check.test.mjs) serves the Worker on a local port.\n"],
]

