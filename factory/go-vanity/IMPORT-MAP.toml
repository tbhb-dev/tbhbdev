"package.json" = "factory/go-vanity/package.json"
"pnpm-lock.yaml" = "factory/go-vanity/pnpm-lock.yaml"
"pnpm-workspace.yaml" = "factory/go-vanity/pnpm-workspace.yaml"
"src/index.test.ts" = "factory/go-vanity/src/index.test.ts"
"src/index.ts" = "factory/go-vanity/src/index.ts"
"src/vanity.test.ts" = "factory/go-vanity/src/vanity.test.ts"
"src/vanity.ts" = "factory/go-vanity/src/vanity.ts"
"stryker.config.mjs" = "factory/go-vanity/stryker.config.mjs"
"tsconfig.json" = "factory/go-vanity/tsconfig.json"
"vitest.config.mjs" = "factory/go-vanity/vitest.config.mjs"
"wrangler.jsonc" = "factory/go-vanity/wrangler.jsonc"

