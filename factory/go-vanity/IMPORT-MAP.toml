"biome.json" = "factory/go-vanity/biome.json"
"e2e/check.mjs" = "factory/go-vanity/e2e/check.mjs"
"e2e/check.test.mjs" = "factory/go-vanity/e2e/check.test.mjs"
"e2e/main.mjs" = "factory/go-vanity/e2e/main.mjs"
