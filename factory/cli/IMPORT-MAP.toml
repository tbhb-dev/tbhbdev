[rewrite."tests/test_ci_workflow.py"]
dest = "factory/cli/tests/test_ci_workflow.py"
replace = [
    ["\"\"\"Exercise the repository's inline PR draft gate with real Git diffs.\"\"\"\n\nimport subprocess\nfrom pathlib import Path\n\nimport pytest\nimport yaml\n\nfrom tbhbdev.alpha.pull_request import DRAFT\n\nWORKFLOW = Path(__file__).resolve().parents[1] / \".github/workflows/ci.yml\"\n\n\n@pytest.mark.parametrize(\n    \"change\", [\"add\", \"modify\", \"delete\", \"rename\", \"other\", \"bad-base\"]\n)\ndef test_pr_draft_gate(tmp_path: Path, change: str) -> None:\n    workflow = yaml.safe_load(WORKFLOW.read_text())\n    job = workflow[\"jobs\"][\"pr-draft\"]\n    assert \"pr-draft\" in workflow[\"jobs\"][\"conclusion\"][\"needs\"]\n    assert job[\"permissions\"] == {\"contents\": \"read\"}\n    checkout, gate = job[\"steps\"]\n    assert checkout[\"if\"] == gate[\"if\"] == \"github.event_name == 'pull_request'\"\n    assert checkout[\"with\"] == {\"fetch-depth\": 0, \"persist-credentials\": False}\n\n    def git(*args: str) -> None:\n        subprocess.run([\"git\", *args], cwd=tmp_path, check=True, capture_output=True)\n\n    git(\"init\", \"--initial-branch=main\")\n    git(\"config\", \"user.name\", \"Example\")\n    git(\"config\", \"user.email\", \"example@example.com\")\n    git(\"config\", \"commit.gpgsign\", \"false\")\n    draft = tmp_path / DRAFT\n    draft.parent.mkdir()\n    if change in (\"modify\", \"delete\"):\n        draft.write_text(\"before\\n\")\n    other = tmp_path / \"other.md\"\n    other.write_text(\"other\\n\")\n    git(\"add\", \".\")\n    git(\"commit\", \"-qm\", \"initial\")\n    if change != \"bad-base\":\n        git(\"update-ref\", \"refs/remotes/origin/main\", \"HEAD\")\n    if change == \"delete\":\n        draft.rename(tmp_path.parent / f\"{tmp_path.name}-removed.md\")\n    elif change == \"rename\":\n        other.rename(draft)\n    elif change in (\"add\", \"modify\"):\n        draft.write_text(\"after\\n\")\n    else:\n        other.write_text(\"changed\\n\")\n    git(\"add\", \"-A\")\n    git(\"commit\", \"-qm\", \"change\")\n    done = subprocess.run(\n        [\"bash\", \"-e\", \"-c\", gate[\"run\"]],\n        cwd=tmp_path,\n        text=True,\n        capture_output=True,\n        check=False,\n    )\n    if change == \"other\":\n        assert done.returncode == 0\n        assert done.stdout == \"\"\n    elif change == \"bad-base\":\n        assert done.returncode != 0\n    else:\n        assert done.returncode == 1\n        assert done.stdout == (\n            f\"PR diff contains {DRAFT}; remove it from the commits\\n\"\n        )\n", "\"\"\"Check that root CI tests the targets selected for the pull request.\"\"\"\n\nfrom pathlib import Path\n\nimport yaml\n\n\ndef test_ci_runs_affected_targets() -> None:\n    parents = Path(__file__).resolve().parents\n    workspace = next(parent.parent for parent in parents if parent.name == \"factory\")\n    workflow = workspace / \".github/workflows/ci.yml\"\n    steps = yaml.safe_load(workflow.read_text())[\"jobs\"][\"bazel\"][\"steps\"]\n    selector = next(step for step in steps if step.get(\"id\") == \"affected\")\n    assert selector[\"uses\"] == \"./.github/actions/affected-targets\"\n    test = next(step for step in steps if step[\"name\"] == \"Test\")\n    assert test[\"env\"][\"TARGETS\"] == \"${{ steps.affected.outputs.file }}\"\n    assert '--target_pattern_file=\"$TARGETS\"' in test[\"run\"]\n"],
]

