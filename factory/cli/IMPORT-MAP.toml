ig-checker\": \"@tbhb_rules_editorconfig_checker//:editorconfig-checker\",\n        \"gitleaks\": \"@tbhb_rules//lint:gitleaks\",\n        \"ruff\": \":ruff\",\n        \"rumdl\": \"@tbhb_rules_rumdl//:rumdl\",\n        \"ryl\": \"@tbhb_rules_ryl//:ryl\",\n        \"scc\": \"@tbhb_rules_scc//:scc\",\n        \"shellcheck\": \"@tbhb_rules_shellcheck//:shellcheck\",\n        \"shfmt\": \"@tbhb_rules_shfmt//:shfmt\",\n        \"tombi\": \"@tbhb_rules_tombi//:tombi\",\n        \"vale\": \"@tbhb_rules_vale//:vale\",\n        \"zizmor\": \"@tbhb_rules_zizmor//:zizmor\",\n    },\n)\n", "    },\n)\n"],
