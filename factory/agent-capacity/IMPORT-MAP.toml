file of the repository, for the whole-tree checks below. Each package\n# calls repo_files() too, so the chain covers the tree. Directories that hold\n# no source are ignored in REPO.bazel; these are the gitignored loose files\n# that can sit in a working checkout.\nrepo_files(\n    exclude = [\n        \"**/.DS_Store\",\n        \".bazelrc.user\",\n        \".coverage*\",\n        \".env*\",\n        \".mutation/**\",\n        \".claude/settings.local.json\",\n        \".github/PULL_REQUEST_DRAFT.md\",\n        \"coverage.*\",\n        \"mise.local.toml\",\n        # Synced Vale packages: only the project's own style is tracked.\n        \".vale/Google/**\",\n        \".vale/write-good/**\",\n        \".vale/proselint/**\",\n        \".vale/ai-tells/**\",\n        \".vale/ai-tells-experimental/**\",\n        \".vale/config/scripts/**\",\n        \".vale/config/templates/**\",\n    ],\n)\n\n# Whole-tree gates over //:repo_files, from tbhb_rules. Each test runs its\n# tool over a dereferenced copy of the tree, so it is hermetic and cached,\n# and fails when it scanned nothing.\ngitleaks_test(\n    name = \"gitleaks_test\",\n    srcs = [\":repo_files\"],\n    config = \".gitleaks.toml\",\n)\n\n# `bazel run //:gitleaks_history` scans every commit. History is not a\n# declared input, so it cannot be a cached test; CI runs it.\ngitleaks_history(\n    name = \"gitleaks_history\",\n    config = \".gitleaks.toml\",\n)\n\nryl_test(\n    name = \"ryl_test\",\n    srcs = [\":repo_files\"],\n    config = \".ryl.toml\",\n    data = [\".rylignore\"],\n)\n\n# pyproject.toml's embedded schema refers to these by URL; tombi runs\n# offline, so it reads the pinned copies from MODULE.bazel.\ntombi_test(\n    name = \"tombi_test\",\n    srcs = [\":repo_files\"],\n    config = \"tombi.toml\",\n    schemas = {\n        \"https://www.schemastore.org/uv.json\": \"@schemastore_uv//file\",\n    },\n)\n\nrumdl_test(\n    name = \"rumdl_test\",\n    srcs = [\":repo_files\"],\n    config = \".rum