\n# `bazel run //:vale_sync` writes the same packages into .vale/, for editors\n# and for running vale by hand.\nvale_sync(\n    name = \"vale_sync\",\n    config = \".vale.ini\",\n    packages = VALE_PACKAGES,\n)\n\n# Formatters. `bazel run //:format` rewrites the workspace in place,\n# `bazel run //:format.check` only reports, and //:format_test makes\n# `bazel test //...` fail on any unformatted file.\nFORMATTERS = [\n    \"@tbhb_rules//format:buildifier\",\n    \"@tbhb_rules//format:rumdl\",\n    \"@tbhb_rules//format:ryl\",\n    \"@tbhb_rules//format:shfmt\",\n    \"@tbhb_rules//format:tombi\",\n    \"@tbhb_rules_go//:golangci_fmt\",\n]\n\nformat(\n    name = \"format\",\n    formatters = FORMATTERS,\n)\n\nformat_test(\n    name = \"format_test\",\n    srcs = [\":repo_files\"],\n    formatters = FORMATTERS,\n)\n\n# `bazel run //:bazel_env` puts shims for the Bazel-pinned tools in\n# .bazel_env/bin, which mise and direnv add to PATH. Git hooks call them\n# directly, so a commit never waits on the Bazel server. bazel_env.bzl builds\n# its bin directory with POSIX tools that fail under Windows' Bash, so the\n# shims are for macOS and Linux.\nbazel_env(\n    name = \"bazel_env\",\n    target_compatible_with = select({\n        \"@platforms//os:windows\": [\"@platforms//:incompatible\"],\n        \"//conditions:default\": [],\n    }),\n    toolchains = {\n        \"go\": \"@rules_go//go:toolchain\",\n    },\n    tools = {\n        \"actionlint\": \"@tbhb_rules_actionlint//:actionlint\",\n        \"buildifier\": \"@buildifier_prebuilt//:buildifier\",\n        \"cog\": \"@tbhb_rules_cog//:cog\",\n        \"cspell\": \"@tbhb_rules//lint/private/cspell\",\n        \"editorconfig-checker\": \"@tbhb_rules_editorconfig_checker//:editorconfig-checker\",\n        \"git\": \"@tbhb_rules_git//:git\",\n        \"gitleaks\": \"@tbhb_rules//lint:gitleaks\",\n        \"go\": \"@rules_go//go\",\n        \"python\": \"//tools:python\",\n        \"rumdl\": \"@tbhb_rules_rumdl//:rumdl