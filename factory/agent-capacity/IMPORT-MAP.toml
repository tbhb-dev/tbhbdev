file of the repository, for the whole-tree checks below. Each package\n# calls repo_files() too, so the chain covers the tree. Directories that hold\n# no source are ignored in REPO.bazel; these are the gitignored loose files\n# that can sit in a working checkout.\nrepo_files(\n    exclude = [\n        \"**/.DS_Store\",\n        \".bazelrc.user\",\n        \".coverage*\",\n        \".env*\",\n        \".mutation/**\",\n        \".claude/settings.local.json\",\n        \".github/PULL_REQUEST_DRAFT.md\",\n        \"coverage.*\",\n        \"mise.local.toml\",\n        # Synced Vale packages: only the project's own style is tracked.\n        \".vale/Google/**\",\n        \".vale/write-good/**\",\n        \".vale/proselint/**\",\n        \".vale/ai-tells/**\",\n        \".vale/ai-tells-experimental/**\",\n        \".vale/config/scripts/**\",\n        \".vale/config/templates/**\",\n    ],\n)\n\n# Whole-tree gates over //:repo_files, from tbhb_rules. Each test runs its\n# tool over a dereferenced copy of the tree, so it is hermetic and cached,\n# and fails when it scanned nothing.\ngitleaks_test(\n    name = \"gitleaks_test\",\n    srcs = [\":repo_files\"],\n    config = \".gitleaks.toml\",\n)\n\n# `bazel run //:gitleaks_history` scans every commit. History is not a\n# declared input, so it cannot be a cached test; CI runs it.\ngitleaks_history(\n    name = \"gitleaks_history\",\n    config = \".gitleaks.toml\",\n)\n\nryl_test(\n    name = \"ryl_test\",\n    srcs = [\":repo_files\"],\n    config = \".ryl.toml\",\n    data = [\".rylignore\"],\n)\n\n# pyproject.toml's embedded schema refers to these by URL; tombi runs\n# offline, so it reads the pinned copies from MODULE.bazel.\ntombi_test(\n    name = \"tombi_test\",\n    srcs = [\":repo_files\"],\n    config = \"tombi.toml\",\n    schemas = {\n        \"https://www.schemastore.org/uv.json\": \"@schemastore_uv//file\",\n    },\n)\n\nrumdl_test(\n    name = \"rumdl_test\",\n    srcs = [\":repo_files\"],\n    config = \".rumdl.toml\",\n)\n\neditorconfig_checker_test(\n    name = \"editorconfig_checker_test\",\n    srcs = [\":repo_files\"],\n    config = \".editorconfig-checker.json\",\n)\n\nactionlint_test(\n    name = \"actionlint_test\",\n    srcs = [\":repo_files\"],\n)\n\n# Offline audits. The online ones need a token and the network; CI runs\n# them outside the test graph.\nzizmor_test(\n    name = \"zizmor_test\",\n    srcs = [\":repo_files\"],\n    config = \".github/zizmor.yml\",\n)\n\n# Shell scripts, found by extension and shebang.\nshellcheck_test(\n    name = \"shellcheck_test\",\n    srcs = [\":repo_files\"],\n)\n\n# shfmt reads its style from .editorconfig.\nshfmt_test(\n    name = \"shfmt_test\",\n    srcs = [\":repo_files\"],\n)\n\nbats_test(\n    name = \"bats_test\",\n    srcs = [\":repo_files\"],\n    tests = [\"tools/get_workspace_status.bats\"],\n)\n\n# Every CODEOWNERS pattern still matches a file. GitHub's owner and syntax\n# validation needs its API, so CI runs that outside the test graph.\ncodeowners_test(\n    name = \"codeowners_test\",\n    srcs = [\":repo_files\"],\n)\n\n# docs/ as an OKF v0.2 bundle, and every Markdown file's frontmatter, against\n# the schemas in docs/schemas.\nokf_docs_test(\n    name = \"okf_docs_test\",\n    srcs = [\":repo_files\"],\n)\n\n# Copyright and licensing information on every file (REUSE.toml, LICENSES/).\nreuse_test(\n    name = \"reuse_test\",\n    srcs = [\":repo_files\"],\n)\n\ncspell_test(\n    name = \"cspell_test\",\n    srcs = [\":repo_files\"],\n    config = \".cspell.jsonc\",\n    data = [\".cspell-words.txt\"],\n)\n\n# Vale style packages, in .vale.ini's `Packages` order.\n# Markdown and Go comments, against the pinned packages, offline.\nvale_test(\n    name = \"vale_test\",\n    srcs = [\":repo_files\"],\n    include = [\n        \"*.md\",\n        \"*.go\",\n    ],\n    config = \".vale.ini\",\n    packages = VALE_PACKAGES,\n    # Concurrent runs flake on the shared style cache.\n    tags = [\"exclusive\"],\n)\n\n# `bazel run //:vale_sync` writes the same packages into .vale/, for editors\n# and for running vale by hand.\nvale_sync(\n    name = \"vale_sync\",\n    config = \".vale.ini\",\n    packages = VALE_PACKAGES,\n)\n\n# Formatters. `bazel run //:format` rewrites the workspace in place,\n# `bazel run //:format.check` only reports, and //:format_test makes\n# `bazel test //...` fail on any unformatted file.\nFORMATTERS = [\n    \"@tbhb_rules//format:buildifier\",\n    \"@tbhb_rules//format:rumdl\",\n    \"@tbhb_rules//format:ryl\",\n    \"@tbhb_rules//format:shfmt\",\n    \"@tbhb_rules//format:tombi\",\n    \"@tbhb_rules_go//:golangci_fmt\",\n]\n\nformat(\n    name = \"format\",\n    formatters = FORMATTERS,\n)\n\nformat_test(\n    name = \"format_test\",\n    srcs = [\":repo_files\"],\n    formatters = FORMATTERS,\n)\n\n# `bazel run //:bazel_env` puts shims for the Bazel-pinned tools in\n# .bazel_env/bin, which mise and direnv add to PATH. Git hooks call them\n# directly, so a commit never waits on the Bazel server. bazel_env.bzl builds\n# its bin directory with POSIX tools that fail under Windows' Bash, so the\n# shims are for macOS and Linux.\nbazel_env(\n    name = \"bazel_env\",\n    target_compatible_with = select({\n        \"@platforms//os:windows\": [\"@platforms//:incompatible\"],\n        \"//conditions:default\": [],\n    }),\n    toolchains = {\n        \"go\": \"@rules_go//go:toolchain\",\n    },\n    tools = {\n        \"actionlint\": \"@tbhb_rules_actionlint//:actionlint\",\n        \"buildifier\": \"@buildifier_prebuilt//:buildifier\",\n        \"cog\": \"@tbhb_rules_cog//:cog\",\n        \"cspell\": \"@tbhb_rules//lint/private/cspell\",\n        \"editorconfig-checker\": \"@tbhb_rules_editorconfig_checker//:editorconfig-checker\",\n        \"git\": \"@tbhb_rules_git//:git\",\n        \"gitleaks\": \"@tbhb_rules//lint:gitleaks\",\n        \"go\": \"@rules_go//go\",\n        \"python\": \"//tools:python\",\n        \"rumdl\": \"@tbhb_rules_rumdl//:rumdl