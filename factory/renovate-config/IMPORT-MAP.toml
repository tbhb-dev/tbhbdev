# factory/renovate-config/OWNERS: Required for every project folder (appendix
# C).
# factory/renovate-config/IMPORT-MAP.toml: This file.
# BUILD.bazel: Edit to the shared root: exports the root Renovate workflow to
# //factory/renovate-config, whose tests read it.
# factory/BUILD.bazel: Edit to the shared root: //factory:repo_files takes the
# project's own repo_files, because a glob can't enter the project's package.
# .editorconfig-checker.json: Edit to the shared root: excludes the root
# Renovate workflow, whose inline Python keeps the bracket-aligned continuation
# lines of the source. The old repository excluded the same file.
# .cspell-words.txt: Edit to the shared root: the words the copied files use
# that the shared list lacked.
#
# The root renovate.json5 and .github/workflows/renovate.yaml replace the
# source config and workflows listed in drop.
# The verifier also has no entry type for the two project additions
# (OWNERS and this map).

