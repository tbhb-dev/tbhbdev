  [
    '''

Shared self-hosted Renovate setup for the tbhb-dev repositories. It holds
seven presets and two reusable workflows: one runs Renovate for the calling
repo, and the other validates that repo's Renovate configuration.

The Renovate workflow checks its JSON file log after each run, failing on
missing, empty, invalid, or incomplete logs. Error or fatal entries and the
known failures `Error updating branch`, `artifactErrors`, and
`Failed to update MODULE.bazel.lock` also fail the job. The workflow defines
this allowlist. Annotations show only a fixed label and a validated branch.

''',
    '''

The shared Renovate presets for this repository, and the tests that check them against the Renovate workflow. The root `renovate.json5` extends the presets from this folder, and the root workflow `.github/workflows/renovate.yaml` runs a self-hosted Renovate on a GitHub App token.

This project came from the `tbhb-dev/renovate-config` repository at commit `6fc408cfec75871cd01b04bf1396e4f82c7fc792`. `IMPORT-MAP.toml` lists every file of that commit as copied, dropped, or rewritten. The earlier history stays in that repository's archive.

''',
