    '''
| Path | Purpose |
|---|---|
| `.github/workflows/renovate.yaml` | Reusable (`workflow_call`) Renovate run for the caller's repo. Global settings live in its `env`. |
| `.github/workflows/renovate-config-validator.yaml` | Reusable strict validation, preset-reference resolution, consistent consumer pins, and PR pin-range summaries. |
| `.github/workflows/ci.yml` | This repo's gate: `bazel test //...` over the tree, rules' shared repository checks, preset validation, and the `conclusion` job. |
| `.github/workflows/renovate-self.yaml` | Renovate for this repo, through its own reusable workflow. |
| `default.json5` | Every repo: best-practices, 5-day cooldown, ignore paths, grouping, Vale and preset-pin managers, `platformCommit`, and PR titles that fit the 72-character squash subject. |
| `bazel.json5` | Bazel repos: `bazel` manager on `MODULE.bazel` and `*.bzl`, dugite datasource, Bazel version group with its one post-upgrade task. |
| `cloudflare-worker.json5` | Worker repos: a `tbhb_rules` bump regenerates `worker-configuration.d.ts` in the same branch. |
| `rules-cloudflare.json5` | `tbhb-dev/rules` only: a bump of wrangler or its group (vitest, playwright) regenerates both smoke Workers' `worker-configuration.d.ts` in the same branch. |
| `go.json5` | Go repos: `gomodTidy` plus module and toolchain groups. |
| `python.json5` | uv projects: `pyproject.toml`, `uv.lock`, the uv version pin. |
| `ansible.json5` | Repos that pin Galaxy collections with `tbhb_rules_ansible`. A collection bump rewrites `requirements.lock.json` in the same branch. |

## Using it from a repo

Add `.github/renovate.json5`, a caller `.github/workflows/renovate.yaml` and a
validator caller. Pin the presets and workflows to a full commit hash, with a
trailing comment that states the ref it tracks: `main`, which Renovate bumps
to the branch's latest commit, or a release tag such as `v1.0.0`:

```json5
{
  extends: [
    "github>tbhb-dev/renovate-config//default.json5#<sha>", // main
    "github>tbhb-dev/renovate-config//bazel.json5#<sha>", // main
  ],
}
```

```yaml
on:
  push:
    branches: [main]
  schedule:
    - cron: "<minute> * * * 1-5"
    - cron: "<minute> */2 * * 6,0"
  workflow_dispatch:

jobs:
  renovate:
    uses: tbhb-dev/renovate-config/.github/workflows/renovate.yaml@<sha> # main
    secrets:
      RENOVATE_CLIENT_ID: ${{ secrets.RENOVATE_CLIENT_ID }}
      RENOVATE_PRIVATE_KEY: ${{ secrets.RENOVATE_PRIVATE_KEY }}
```

The push trigger runs Renovate on each push to the caller repository's `main`,
when open PRs can fall behind. Merges in `tbhb-dev/renovate-config` or any other
repository don't trigger the caller. GitHub drops scheduled runs for hours at a
time, and the push trigger doesn't depend on the schedule. Pick a different
`<minute>` per repository to stagger only the scheduled starts.

The reusable workflow defaults `dry_run` to `false`, so the bare
`workflow_dispatch:` runs Renovate for real at `DEBUG`, as do pushes and
scheduled runs. To default manual runs to a dry run, copy the
`workflow_dispatch` inputs and `with:` expressions from
`.github/workflows/renovate-self.yaml`.

The validator caller runs on PRs that change the Renovate config, the
workflows, or a `tbhb_rules` pin. The pin checks then see every bump:

```yaml
on:
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/*.yaml"
      - ".github/workflows/*.yml"
      - "MODULE.bazel"
      - "**/*.bzl"

jobs:
  validate:
    uses: tbhb-dev/renovate-config/.github/workflows/renovate-config-validator.yaml@<sha> # main
    with:
      configs: .github/renovate.json5
```

A preset reference must include the `.json5` suffix.

The validator requires
all `tbhb-dev/renovate-config` preset and reusable workflow pins in a consumer
to use the same full 40-character commit hash. Repositories without these
references pass the check. Renovate keeps them in step: every
`tbhb-dev/renovate-config` reference, preset or workflow, joins the
`pins` group in `default.json5`, so one PR moves them all.

The `pins` group opens one PR per repository a day, between 05:00 and 08:00
Coordinated Universal Time. It takes the `renovate-config` and `tbhb_rules`
pins, plus minor, patch, and digest updates to GitHub Actions and mise tools.
Renovate opens a separate PR for each major version and each security fix.
The Bazel version group uses the same window but stays a separate PR, and so
do `tbhb_rules` bumps in Worker repos, because each runs its own post-upgrade
task. Renovate rebases a pins PR whenever its base branch moves. The presets set
every other group to rebase only on a conflict, but Renovate's built-in
"Pin Dependencies" default (`pin.rebaseWhen`) still rebases npm pin PRs
whenever their base moves. A rule that sets another `groupName` must set
`rebaseWhen: "conflicted"` too, because matching rules merge field by field.
One failing pin blocks the rest of the group. To exclude one, add a rule to the
repository's `.github/renovate.json5`:

```json5
{
  packageRules: [
    { matchPackageNames: ["<package>"], groupName: "<package>", rebaseWhen: "conflicted" },
  ],
}
```

Worker repos add `github>tbhb-dev/renovate-config//cloudflare-worker.json5#<sha>`
after `bazel.json5` in their `extends` list.

Renovate PRs auto-merge after the main ruleset's required approval and CI
checks pass. Before Renovate starts, the workflow checks active rules on
`main` using the Renovate App token. It requires at least one approving
review and a status-check rule. Every applied ruleset must report that the
App can never bypass it. Only the drafts repositories pass
`require_approval: false`, because their PRs merge on green CI alone. Their
check keeps the status-check and bypass parts. Missing protection or a failed API check stops
the run. Consumer repos must enable "Allow auto-merge" in GitHub
settings for native auto-merge.

Extend `ansible.json5` only from a repository whose root `MODULE.bazel`
declares `ansible.collections`. The lock task runs at the repository root,
so it rewrites the `requirements.lock.json` that tag names. A repository
with an Ansible module root nested below its own root shouldn't extend the
preset, because the task fails there.

Both reusable workflows take a `runs_on` input, the runner label, which
defaults to `ubuntu-24.04`. Public repositories leave it out. A private
repository must pass its `tbhb-dev-*` runner label, because private jobs
never run on GitHub-hosted runners:

```yaml
    with:
      runs_on: tbhb-dev-ubuntu-24-amd64
```

## Pin-bump validation

On pull requests, the validator checks changed `tbhb-dev/renovate-config` and
`tbhb-dev/rules` pins against their upstream `main` branch. Each new pin must
use a full commit hash on that branch. The job summary lists up to 50 commit
subjects per range and the changed upstream files. New pins have no previous
range to list. Other workflow events skip this check.

## Security model

- `allowedUnsafeExecutions` allows only `bazelModDeps`. It leaves out `mise`,
  so mise stays in safe mode.
- Four post-upgrade commands, each matched by an anchored regular expression
  in the workflow `env`. `bazel.json5` attaches `bazelisk run //:preset.update`
  to the Bazel version group alone. `ansible.json5` attaches
  `bazelisk run @tbhb_rules_ansible//:lock` to `ansible-galaxy` bumps alone.
  The lock target reads Galaxy version metadata and writes
  `requirements.lock.json`, without downloading any collection.
  `cloudflare-worker.json5` attaches `bazelisk run //:worker_types_test.update`
  to `tbhb_rules` bumps in Worker repos and commits only
  `worker-configuration.d.ts` through `fileFilters`.
  `rules-cloudflare.json5` attaches `bazelisk run //:worker_types_test.update`
  and `bazelisk run //nested:worker_types_test.update` to bumps of wrangler
  and its group in `tbhb-dev/rules`, run from
  `cloudflare/e2e/smoke`, and commits only the smoke Workers'
  `worker-configuration.d.ts` files.
- The allowlist applies to each repo that runs the workflow. Scoping a preset
  to one repo is a convention, and no check enforces it. A repo's PR can't add
  a command, but it can use any listed one.
- Both allowlists live in the workflow `env`. They're global-only options,
  which Renovate ignores in a repo's config, so a repo PR can't widen them.
- Each run creates its own App token, limited to the target repo (the caller,
  or the repo the `repository` input names), and downscoped to the
  permissions Renovate needs. A first job rejects any `repository` value that
  isn't `<organization>/<name>` in the caller's organization before the token,
  audit or cache steps run. An empty value means the caller's own repo. A
  public caller can't target a private repo, because its logs and caches are
  public, and a public target with a `.github/workflows/renovate.yaml` is refused.
- The reviews App approves updates that ran commands only when the diff
  touches manifests and lock files, plus the generated file named in
  `fileFilters` for post-upgrade tasks. This covers post-upgrade tasks,
  `bazel mod deps`, and lock maintenance. These PRs auto-merge after the
  required review and CI pass. Lock maintenance also needs a human to tick
  its Dependency Dashboard box before it runs.
- Commits go through the GitHub API (`platformCommit`), so GitHub signs them.
''',
    '''
| Path | Purpose |
| --- | --- |
| `default.json5` | Every repository: best-practices, a 5-day cooldown, ignore paths, grouping, Vale and preset-pin managers, `platformCommit`, and PR titles that fit the 72-character squash subject. |
| `bazel.json5` | Bazel roots: the `bazel` manager for `MODULE.bazel` and `*.bzl` files, and the Bazel version group with its one post-upgrade task. A `customDatasources` entry covers dugite. |
| `go.json5` | Go roots: `gomodTidy` plus module and toolchain groups. |
| `python.json5` | uv projects: `pyproject.toml`, `uv.lock`, and the uv version pin. |
| `ansible.json5` | Roots that pin Galaxy collections with `tbhb_rules_ansible`. A collection bump rewrites `requirements.lock.json` in the same branch. |
| `cloudflare-worker.json5` | Worker projects: a `tbhb_rules` bump regenerates `worker-configuration.d.ts` in the same branch. |
| `rules-cloudflare.json5` | Used by the rules project alone. A bump of wrangler or its group regenerates both smoke Workers' `worker-configuration.d.ts` in the same branch. |
| `renovate_*_test.py` | Tests for the presets and for the inline scripts of the root workflow. Each has a `renovate_*_test.sh` wrapper and a Bazel target in `BUILD.bazel`. |

The root `renovate.json5` extends `default.json5`, `bazel.json5`, `go.json5`, and `python.json5`. The other three presets wait for the manifest each one acts on.

## Rules for the presets

- Only repository-level options belong in a preset. Global-only settings (identity, limits, allowed commands, host rules with tokens) live in the root workflow's `env`, where a pull request can't widen them.
- A preset reference must end in `.json5`. The presets in this folder extend only the built-in presets of Renovate, so resolution stays one hop deep.
- A rule that sets another `groupName` must set `rebaseWhen: "conflicted"` too, because matching rules merge field by field. `renovate_grouping_test.py` checks it.
- Every post-upgrade command in a preset must match exactly one anchored regular expression in the workflow's `RENOVATE_ALLOWED_COMMANDS`, and every regular expression must match a command. `renovate_allowlist_test.py` checks both directions.

## The root workflow

The workflow runs on each push to `main`, on the schedule, and on demand. It checks the log of each run, and it fails on a missing, empty, invalid, or incomplete log, on an error or fatal entry, and on the known failures `Error updating branch`, `artifactErrors`, and `Failed to update MODULE.bazel.lock`.

Before Renovate starts, the workflow audits the active rules on `main` with the Renovate App token. It requires at least one approving review and a status-check rule, and every applied ruleset must report that the App can never bypass it. Missing protection or a failed API check stops the run.

Each run creates its own App token, scoped to this repository, with only the permissions Renovate needs. Commits go through the GitHub API, so GitHub signs them. `allowedUnsafeExecutions` allows only `bazelModDeps`, which leaves `mise` in safe mode. The reviews App approves updates that ran commands only when the diff touches manifests, lock files, and the generated file a task names in `fileFilters`.

## What isn't here

The old repository's reusable workflows and the tools around consumer pins (the validator workflow, its pin-range and pin-consistency tests, and the pin-bump script) don't come along. This repository pins no commit of the old repository, so there are no pins for them to check. A CI gate that runs `renovate-config-validator` over the presets and the root `renovate.json5` is a separate change.
''',
  ],
]

