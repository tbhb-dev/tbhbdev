# The path map of the import of tbhb-dev/renovate-config into factory/renovate-config,
# written by hand the way `tbhbdev alpha monorepo import` will write it. Every file of
# the source commit appears once in [[file]] as copy, drop, or rewrite. A copy is
# byte-identical to its source, and `blob` is the source file's Git blob id.
# [[added]] lists what the source never had.

