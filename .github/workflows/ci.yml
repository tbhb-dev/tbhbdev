---
name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel:
    name: bazel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      # Remote cache and affected-targets selection (rules#422) land in PR 2.
      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...

  gazelle-current:
    name: gazelle-current
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: Check that BUILD files are current
        run: bazel run //:gazelle -- -mode=diff

  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, gazelle-current]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Fail if any needed job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
