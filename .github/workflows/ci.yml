---
name: ci

on:
  # The merge queue run gates main, so there is no push run by design.
  # A future push run must use `github.event.before` as its base.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit to compare against. Defaults to the dispatched commit's first parent.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel:
    name: bazel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: Make Bazelisk available to the target selector
        run: |
          if ! command -v bazelisk >/dev/null; then
            bazel_path=$(command -v bazel)
            ln -s "$bazel_path" "${RUNNER_TEMP}/bazelisk"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi

      - name: Select affected targets
        id: affected
        uses: ./.github/actions/affected-targets
        with:
          base: ${{ inputs.base }}

      - name: Configure the remote cache
        env:
          CACHE_URL: ${{ vars.BAZEL_CACHE_URL }}
          TOKEN: ${{ github.event_name == 'merge_group' && secrets.BAZEL_CACHE_TOKEN || github.event_name == 'pull_request' && secrets.BAZEL_CACHE_PR_TOKEN || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z $TOKEN || -z $CACHE_URL ]]; then
            echo "::notice::Remote cache URL or token unavailable"
            exit 0
          fi
          if [[ ! $CACHE_URL =~ ^https://([a-zA-Z0-9.-]+)/?$ ]]; then
            echo "::error::BAZEL_CACHE_URL must be an HTTPS origin"
            exit 1
          fi
          host=${BASH_REMATCH[1]}
          dir=$(mktemp -d "${RUNNER_TEMP}/bazel-cache.XXXXXXXX")
          (umask 077 && printf '%s' "$TOKEN" > "$dir/token")
          cat > "$dir/credential-helper" <<'HELPER'
          #!/bin/sh
          cat >/dev/null
          jq -nc --rawfile token "$(dirname "$0")/token" '{headers: {Authorization: ["Bearer " + $token]}}'
          HELPER
          chmod 700 "$dir/credential-helper"
          {
            printf '\ncommon --remote_cache=https://%s\n' "$host"
            printf 'common --credential_helper=%s=%s/credential-helper\n' "$host" "$dir"
            printf 'common --remote_timeout=120\n'
            if [[ -n $PR_NUMBER ]]; then
              printf 'common --remote_header=Bazel-Cache-Pull-Request=%s/%s\n' "$GITHUB_REPOSITORY" "$PR_NUMBER"
            fi
          } >> "$HOME/.bazelrc"

      - name: Test
        if: steps.affected.outputs.count != '0'
        env:
          TARGETS: ${{ steps.affected.outputs.file }}
        run: bazel test --config=ci --build_tests_only --target_pattern_file="$TARGETS"

  gazelle-current:
    name: gazelle-current
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: Check that BUILD files are current
        run: bazel run //:gazelle -- -mode=diff

      - name: Check that the Bazel module is tidy
        run: |
          bazel mod tidy
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock

      - name: Lint GitHub Actions workflows
        run: bazel test --config=ci //:actionlint_test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: Scan Git history and pull request text
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bazel run --config=ci //:gitleaks_history -- --log-opts='--diff-merges=first-parent HEAD'
          if [[ $EVENT == pull_request ]]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bazel run --config=ci @tbhb_rules//lint:gitleaks_text
          fi

  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, gazelle-current, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Fail if any needed job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
