---
name: ci

on:
  # The merge queue run gates main, so there is no push run by design.
  # A future push run must use `github.event.before` as its base.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit to compare against. Defaults to the dispatched commit's first parent.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected-targets:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'cache' || '' }}
    outputs:
      count: ${{ steps.selection.outputs.count }}
      all: ${{ steps.selection.outputs.all }}
      reason: ${{ steps.selection.outputs.reason }}
      digest: ${{ steps.selection.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}

      - name: Use the remote cache
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@bdd7e71f0281998f10a52f253bcf4b9ec81396e8  # main
        with:
          main-token: ${{ secrets.BAZEL_CACHE_TOKEN }}
          pr-token: ${{ secrets.BAZEL_CACHE_PR_TOKEN }}

      - name: Select affected targets
        id: affected
        uses: ./.github/actions/affected-targets
        with:
          base: ${{ inputs.base }}
          explain: 'true'

      - name: Publish the affected targets
        id: selection
        shell: bash
        env:
          TARGETS: ${{ steps.affected.outputs.file }}
          SORTED_TARGETS: ${{ runner.temp }}/affected-targets.txt
          COUNT: ${{ steps.affected.outputs.count }}
          ALL: ${{ steps.affected.outputs.all }}
          REASON: ${{ steps.affected.outputs.reason }}
        run: |
          LC_ALL=C sort "$TARGETS" >"$SORTED_TARGETS"
          digest=$(sha256sum <"$SORTED_TARGETS")
          printf 'count=%s\nall=%s\nreason=%s\ndigest=%s\n' \
            "$COUNT" "$ALL" "$REASON" "${digest%% *}" >>"$GITHUB_OUTPUT"

          token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$token"
          {
            printf '\n### Sorted target patterns\n\n'
            if [[ -s $SORTED_TARGETS ]]; then
              sed 's/^/    /' "$SORTED_TARGETS"
            else
              echo 'No affected targets.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" | awk '{ print "  | " $0 }'

          log=${TARGETS%/*}/target-determinator.log
          if [[ -s $log ]]; then
            echo 'Target-determinator diagnostics:'
            { grep -E '^[^[:space:]]+ Changes:' "$log" || tail -n 40 "$log"; } | awk '{ print "  | " $0 }'
          fi
          echo "::$token::"

      - name: Upload the affected targets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: affected-targets
          path: ${{ runner.temp }}/affected-targets.txt
          retention-days: 3
          if-no-files-found: error

  bazel:
    name: bazel (${{ matrix.shard }})
    needs: affected-targets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A push to main or a merge_group run uses the main token, a secret
    # of the main-only `cache` environment that no pull request can read.
    # Pull requests use the org's PR token, which writes only their own
    # namespace. This job stays in this file because a job in a reusable
    # workflow doesn't get its environment's secrets.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'cache' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-${{ matrix.shard }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}

      # The bazel-r2-cache remote cache, through its shared action. A fork's
      # pull request gets no secrets and builds without the cache.
      - name: Use the remote cache
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@bdd7e71f0281998f10a52f253bcf4b9ec81396e8  # main
        with:
          main-token: ${{ secrets.BAZEL_CACHE_TOKEN }}
          pr-token: ${{ secrets.BAZEL_CACHE_PR_TOKEN }}

      - name: Check commit subjects and lint allowances
        if: matrix.shard == 1
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          base=$(git merge-base -- "${BASE_SHA:-HEAD^}" "$HEAD_SHA")
          subjects=$(git log --format=%s "$base..$HEAD_SHA")
          if grep -q '^rescue:' <<<"$subjects"; then
            echo "Reword or replace rescue commits before merging." >&2
            exit 1
          fi
          bazel run --config=ci @tbhb_rules//lint:lint_baselines -- "$base" "$HEAD_SHA"

      - name: Download the affected targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: affected-targets
          path: ${{ runner.temp }}

      - name: Test
        if: needs.affected-targets.outputs.count != '0'
        shell: bash
        env:
          TARGETS: ${{ runner.temp }}/affected-targets.txt
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          shard_targets=$(mktemp "${RUNNER_TEMP}/bazel-shard.XXXXXXXX")
          LC_ALL=C sort "$TARGETS" | awk -v shard="$SHARD" -v count="$SHARD_COUNT" \
            'NF && !/^-/ && (positive++ % count == shard - 1)' >"$shard_targets"
          if [[ ! -s $shard_targets ]]; then
            echo "No targets in shard $SHARD."
            exit 0
          fi
          # Apply fallback exclusions after the positive patterns in every shard.
          sed -n '/^-/p' "$TARGETS" >>"$shard_targets"
          bazel test --config=ci --build_tests_only --target_pattern_file="$shard_targets"

  cli-coverage:
    name: factory/cli branch coverage
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      coverage: ${{ steps.coverage.outcome }}
    environment: ${{ github.event_name == 'merge_group' && 'cache' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}

      - name: Use the remote cache
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@bdd7e71f0281998f10a52f253bcf4b9ec81396e8  # main
        with:
          main-token: ${{ secrets.BAZEL_CACHE_TOKEN }}
          pr-token: ${{ secrets.BAZEL_CACHE_PR_TOKEN }}

      - name: Select affected targets
        id: affected
        uses: ./.github/actions/affected-targets
        with:
          base: ${{ inputs.base }}

      - name: Combine coverage from the CLI tests
        id: coverage
        if: steps.affected.outputs.count != '0'
        run: bazelisk run --config=ci //factory/cli:coverage

  gazelle-current:
    name: gazelle-current
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Use the same cache environment as bazel so merge queue checks can use the main token.
    environment: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'cache' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}
          # Fetch only the targets this job builds.
          targets: //:gazelle //:actionlint_test

      - name: Use the remote cache
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@bdd7e71f0281998f10a52f253bcf4b9ec81396e8  # main
        with:
          main-token: ${{ secrets.BAZEL_CACHE_TOKEN }}
          pr-token: ${{ secrets.BAZEL_CACHE_PR_TOKEN }}

      - name: Check that BUILD files are current
        run: bazel run //:gazelle -- -mode=diff

      - name: Check that the Bazel module is tidy
        run: |
          bazel mod tidy
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock

      - name: Lint GitHub Actions workflows
        run: bazel test --config=ci //:actionlint_test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: Scan Git history and pull request text
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bazel run --config=ci //:gitleaks_history -- --log-opts='--diff-merges=first-parent HEAD'
          if [[ $EVENT == pull_request ]]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bazel run --config=ci @tbhb_rules//lint:gitleaks_text
          fi

      - name: Scan github-metrics for Go vulnerabilities
        run: |
          bazel test --config=ci //factory/github-metrics:govulncheck_test

  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the base commit's counter and rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git checkout --detach "$BASE_SHA"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-version: 1.30.0
          bazelisk-cache: true

      - name: Count added lines
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_SIZE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          base=$BASE_SHA head=$HEAD_SHA
          if [[ -n $DEFAULT_BRANCH && $BASE_REF != "$DEFAULT_BRANCH" ]]; then
            shared_base=$(git merge-base "$base" "$head")
            shared_default=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$head")
            if shared_tree=$(git merge-tree --write-tree --no-messages "$shared_base" "$shared_default"); then
              # Give the base revision's three-dot counter a pair of commits with the desired trees.
              commit_tree=(git -c user.name='GitHub Actions' -c user.email=actions@github.com commit-tree)
              base=$("${commit_tree[@]}" "$shared_tree" -m 'Shared base and default branch changes')
              head=$("${commit_tree[@]}" "$head^{tree}" -p "$base" -m 'Pull request head tree')
            else
              [[ $? == 1 ]] || exit 1
              base=$shared_default
            fi
          fi
          # A stacked diff can use a synthetic base tree. Read policy from the actual base.
          PR_SIZE_POLICY_BASE="$BASE_SHA" bazel run --config=ci @tbhb_rules//lint:pr_size -- "$base" "$head"

  design-report:
    name: design-report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: design-base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Compare design metrics
        run: |
          tool=lib.rules.lint.private.design_report
          python -m unittest "$tool.test_design_report"
          python -m "$tool.design_report" design-base/factory/cli factory/cli > design-report.md
          cat design-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload design report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: design-report
          path: |
            design-report.md
            base.json
            head.json

  prose:
    name: prose
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the prose tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
        with:
          version: 2026.11.9

      - name: Lint prose
        shell: bash
        run: bash .github/prose-lint.sh all

  agent-capacity:
    name: agent-capacity image and vulnerability scans
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # Upload the dependency scan to Code Scanning.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}
          targets: >-
            //factory/agent-capacity/container:image_multiarch
            //factory/agent-capacity/container:image_config_test
            //factory/agent-capacity:govulncheck
            @rules_go//go

      - name: Build and test the Linux images
        run: >-
          bazel test --config=ci -c opt
          //factory/agent-capacity/container:image_multiarch
          //factory/agent-capacity/container:image_config_test

      - name: Scan for reachable Go vulnerabilities
        run: bazel run --config=ci //factory/agent-capacity:govulncheck -- --sarif="$RUNNER_TEMP/agent-capacity.sarif"

      - name: Retain the Go vulnerability scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent-capacity-govulncheck
          path: ${{ runner.temp }}/agent-capacity.sarif
          if-no-files-found: ignore

      - name: Checkout the dependency scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tbhb-dev/gomodscan
          ref: 1d7083e6ee351b0b4d7705c9c2346ad45d43127c
          path: tmp/gomodscan
          persist-credentials: false

      - name: Vendor dependencies for the module scan
        run: |
          scratch="$RUNNER_TEMP/vendored"
          mkdir "$scratch"
          cp factory/agent-capacity/go.{mod,sum} "$scratch/"
          GOWORK=off bazel run --config=ci @rules_go//go -- \
            -C "$GITHUB_WORKSPACE/factory/agent-capacity" mod vendor -o "$scratch/vendor"

      - name: Scan Go module dependencies
        working-directory: tmp/gomodscan
        run: |
          status=0
          bazel run --config=ci //cmd/gomodscan -- \
            -modroot "$RUNNER_TEMP/vendored" \
            -format sarif -o "$RUNNER_TEMP/gomodscan.sarif" || status=$?
          if ((status > 1)); then exit "$status"; fi

      - name: Upload the Go module scan
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/gomodscan.sarif
          category: agent-capacity-dependencies

  event-gateway:
    name: event-gateway image and vulnerability scans
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}
          targets: >-
            //factory/event-gateway/container:image_multiarch
            //factory/event-gateway/container:image_config_test
            //factory/event-gateway:govulncheck

      - name: Build and test the Linux images
        run: >-
          bazelisk test --config=ci -c opt
          //factory/event-gateway/container:image_multiarch
          //factory/event-gateway/container:image_config_test

      - name: Scan for reachable Go vulnerabilities
        run: >-
          bazelisk run --config=ci //factory/event-gateway:govulncheck
          -- --sarif="$RUNNER_TEMP/event-gateway.sarif"

      - name: Retain the Go vulnerability scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: event-gateway-govulncheck
          path: ${{ runner.temp }}/event-gateway.sarif
          if-no-files-found: ignore

  # The smoke modules under lib/rules/*/e2e/ are Bazel roots of their own, and
  # lib/rules/ is in .bazelignore, so the bazel job never runs their proofs
  # (planted defects that must fail for a stated reason). Nothing else runs
  # them, so a change that breaks one, or edits a fixture a proof depends on,
  # would pass. This job runs the suites that need only the network, and only
  # when their e2e module changes; the job still reports success when nothing
  # matched, so the conclusion job can require it. The other e2e modules need
  # macOS, browsers or Docker and stay manual.
  rules-e2e:
    name: rules e2e proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ github.event_name == 'merge_group' && 'cache' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the e2e modules that changed
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          base=$(git merge-base -- "${BASE_SHA:-HEAD^}" "$HEAD_SHA")
          files=$(git diff --name-only "$base" "$HEAD_SHA" -- 'lib/rules/*/e2e/')
          for module in go ansible; do
            if grep -q "^lib/rules/$module/e2e/" <<<"$files"; then
              echo "$module=true" >>"$GITHUB_OUTPUT"
            else
              echo "$module=false" >>"$GITHUB_OUTPUT"
            fi
          done

      - name: Set up Bazel for CI
        if: steps.changed.outputs.go == 'true' || steps.changed.outputs.ansible == 'true'
        uses: ./.github/actions/setup-bazel-ci
        with:
          disk-cache: ${{ github.workflow }}-${{ github.job }}-ubuntu-26.04
          cache-save: ${{ github.event_name == 'merge_group' }}
          # Each module fetches what it needs when it runs.
          targets: ''

      - name: Use the remote cache
        if: steps.changed.outputs.go == 'true' || steps.changed.outputs.ansible == 'true'
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@bdd7e71f0281998f10a52f253bcf4b9ec81396e8  # main
        with:
          main-token: ${{ secrets.BAZEL_CACHE_TOKEN }}
          pr-token: ${{ secrets.BAZEL_CACHE_PR_TOKEN }}

      # The govulncheck proofs name a vulnerable x/text pinned in
      # lib/rules/go/e2e/smoke/govulncheck/ and need the Go proxy.
      - name: Prove govulncheck
        if: steps.changed.outputs.go == 'true'
        working-directory: lib/rules/go/e2e/smoke
        run: bazelisk test --config=ci //:govulncheck_proofs

      # Includes proof_lock_mismatch, which needs planted/mismatch/requirements.yml
      # to differ from the lock.
      - name: Prove the Ansible checks
        if: steps.changed.outputs.ansible == 'true'
        working-directory: lib/rules/ansible/e2e
        run: bazelisk test --config=ci //ansible:all

  conclusion:
    name: conclusion
    if: always()
    needs:
      - affected-targets
      - bazel
      - cli-coverage
      - gazelle-current
      - gitleaks
      - prose
      - pr-size
      - agent-capacity
      - event-gateway
      - rules-e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Fail if any needed job did not succeed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if ! jq -e --arg event "$EVENT" 'all(to_entries[];
            .value.result == "success" or
            (.value.result == "skipped" and (
              (.key == "pr-size" and $event != "pull_request") or
              (.key == "cli-coverage" and $event == "workflow_dispatch")
            ))
          )' <<<"$NEEDS" >/dev/null; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
          if ! jq -e '."affected-targets".outputs.digest | type == "string" and length == 64' \
            <<<"$NEEDS" >/dev/null; then
            echo "The affected-target list digest was missing or invalid." >&2
            exit 1
          fi
          # The coverage job selects targets independently of the test shards.
          empty_digest=$(sha256sum </dev/null)
          if ! jq -e --arg empty "${empty_digest%% *}" '
            ."cli-coverage" as $coverage |
            $coverage.result == "skipped" or $coverage.outputs.coverage == "success" or
            ($coverage.outputs.coverage == "skipped" and ."affected-targets".outputs.digest == $empty)
          ' <<<"$NEEDS" >/dev/null; then
            echo "CLI branch coverage was required but did not run." >&2
            exit 1
          fi
